<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>마포 클럽하우스 판매 대시보드</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #07090F;
      --surface:      #0D1120;
      --surface-2:    #121828;
      --border:       #1C2540;
      --border-soft:  #141C30;
      --text:         #D0DCF0;
      --text-sub:     #8A9DC0;
      --text-dim:     #3A4F6A;
      --accent:       #3D7FFF;
      --success:      #1FD49A;
      --warning:      #F5A623;
      --gold:         #F5C842;
      --cat-bg:       #111828;
      --prod-bg:      #090C18;
      --hover:        #151F35;
    }

    html, body {
      height: 100%;
      font-family: 'Noto Sans KR', sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
      line-height: 1.5;
    }

    body { padding: 28px 32px 48px; }

    /* ── Header ── */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 36px;
      padding-bottom: 22px;
      border-bottom: 1px solid var(--border);
    }

    .header-brand { display: flex; align-items: center; gap: 14px; }

    .brand-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 12px var(--accent);
      flex-shrink: 0;
    }

    .brand-info .location {
      font-size: 11px; font-weight: 600;
      letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--accent); margin-bottom: 4px;
    }

    .brand-info h1 {
      font-size: 22px; font-weight: 700;
      letter-spacing: -0.03em; color: var(--text);
    }

    .header-meta { text-align: right; }

    .header-meta .label {
      font-size: 10px; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--text-dim); margin-bottom: 3px;
    }

    .header-meta .timestamp {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px; color: var(--text-sub);
    }

    /* ── Section label ── */
    .section-label {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 14px;
    }
    .section-label::after {
      content: ''; flex: 1; height: 1px; background: var(--border);
    }
    .sl-num {
      font-size: 10px; font-weight: 700; letter-spacing: 0.08em;
      color: var(--text-dim);
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2px 7px;
      white-space: nowrap;
    }
    .sl-title {
      font-size: 13px; font-weight: 700; letter-spacing: 0.02em;
      color: var(--text-sub);
      white-space: nowrap;
    }

    /* ── Table wrapper ── */
    .table-wrap {
      border-radius: 12px; border: 1px solid var(--border);
      overflow: hidden; overflow-x: auto;
    }

    table { width: 100%; min-width: 860px; border-collapse: collapse; }

    /* ── Table head ── */
    thead { position: sticky; top: 0; z-index: 10; }
    thead tr { background: var(--surface-2); }

    thead th {
      padding: 11px 16px;
      font-size: 10px; font-weight: 700;
      letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--text-dim); text-align: right; white-space: nowrap;
      border-bottom: 1px solid var(--border);
    }
    thead th.col-name { text-align: left; min-width: 200px; }
    thead th.col-prog { min-width: 130px; }

    /* ── Sticky first column ── */
    table td:first-child,
    table th.col-name { position: sticky; left: 0; z-index: 5; }
    thead th.col-name  { background: var(--surface-2); z-index: 15; }

    /* ── VAT sub-label in header ── */
    .vat-tag {
      display: block;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: var(--gold);
      margin-top: 2px;
      text-transform: uppercase;
    }

    /* ── Category rows ── */
    .cat-row { cursor: pointer; }
    .cat-row td {
      padding: 13px 16px; background: var(--cat-bg);
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border-soft);
      vertical-align: middle;
    }
    .cat-row td:first-child { border-left: 3px solid var(--accent); }
    .cat-row:hover td { background: var(--hover); }

    .cat-name {
      font-weight: 700; font-size: 13px; color: var(--text);
      display: flex; align-items: center; gap: 8px;
    }
    .cat-text { display: flex; flex-direction: column; gap: 2px; }
    .cat-prefix {
      font-size: 10px; font-weight: 600;
      letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--text-dim); line-height: 1;
    }

    /* ── Toggle icon ── */
    .toggle-icon {
      display: inline-block;
      font-size: 9px;
      flex-shrink: 0;
      color: var(--text-dim);
      transition: transform 0.2s ease;
    }
    .cat-row.expanded .toggle-icon { transform: rotate(90deg); }

    /* ── Band colors (브랜드 그룹별 배경) ── */
    /* RP — 파란색 */
    .cat-row.band-rp-pkg td,    .prod-row.band-rp-pkg td    { background: #0D1520; }
    .cat-row.band-rp-pkg td:first-child    { border-left-color: #3D7FFF; }
    .cat-row.band-rp-pkg:hover td, .prod-row.band-rp-pkg:hover td { background: var(--hover); }

    /* BG 패키지 — 녹색 */
    .cat-row.band-bg-pkg td,    .prod-row.band-bg-pkg td    { background: #0A1A14; }
    .cat-row.band-bg-pkg td:first-child    { border-left-color: #1FD49A; }
    .cat-row.band-bg-pkg:hover td, .prod-row.band-bg-pkg:hover td { background: var(--hover); }

    /* BG 멤버십 — 연두색 */
    .cat-row.band-bg-mem td,    .prod-row.band-bg-mem td    { background: #0A1A0C; }
    .cat-row.band-bg-mem td:first-child    { border-left-color: #86EFAC; }
    .cat-row.band-bg-mem:hover td, .prod-row.band-bg-mem:hover td { background: var(--hover); }

    /* PT — 주황색 */
    .cat-row.band-pt td,        .prod-row.band-pt td        { background: #1A0D07; }
    .cat-row.band-pt td:first-child        { border-left-color: #F97316; }
    .cat-row.band-pt:hover td,  .prod-row.band-pt:hover td  { background: var(--hover); }

    /* 체험권 — 노란색 */
    .cat-row.band-pt-trial td,  .prod-row.band-pt-trial td  { background: #181508; }
    .cat-row.band-pt-trial td:first-child  { border-left-color: #FDE047; }
    .cat-row.band-pt-trial:hover td, .prod-row.band-pt-trial:hover td { background: var(--hover); }

    /* TB 패키지 — 보라색 */
    .cat-row.band-tb-pkg td,    .prod-row.band-tb-pkg td    { background: #130F1A; }
    .cat-row.band-tb-pkg td:first-child    { border-left-color: #8B5CF6; }
    .cat-row.band-tb-pkg:hover td, .prod-row.band-tb-pkg:hover td { background: var(--hover); }

    /* TB — 연보라색 */
    .cat-row.band-tb td,        .prod-row.band-tb td        { background: #120D1A; }
    .cat-row.band-tb td:first-child        { border-left-color: #C084FC; }
    .cat-row.band-tb:hover td,  .prod-row.band-tb:hover td  { background: var(--hover); }

    /* 기타 — 회색 */
    .cat-row.band-gray td,      .prod-row.band-gray td      { background: #111318; }
    .cat-row.band-gray td:first-child      { border-left-color: #6B7280; }
    .cat-row.band-gray:hover td, .prod-row.band-gray:hover td { background: var(--hover); }

    /* 일일권 — 진한 노란색 */
    .cat-row.band-trial td, .prod-row.band-trial td { background: #181400; }
    .cat-row.band-trial td:first-child { border-left-color: #D97706; }
    .cat-row.band-trial:hover td, .prod-row.band-trial:hover td { background: var(--hover); }

    /* ── Group separator rows ── */
    .group-header-row td {
      background: rgba(255,255,255,0.05) !important;
      border-top: 1px solid rgba(255,255,255,0.08) !important;
      border-bottom: none !important;
      border-left: 3px solid rgba(255,255,255,0.25) !important;
      padding: 8px 14px;
    }
    .group-label {
      font-size: 10px; font-weight: 700; letter-spacing: 0.15em;
      color: #B0B8C8; text-transform: uppercase;
    }

    /* ── Product rows ── */
    .prod-row td {
      padding: 9px 16px; background: var(--prod-bg);
      border-bottom: 1px solid var(--border-soft);
      vertical-align: middle;
    }
    .prod-row.last-in-group td { border-bottom: 1px solid var(--border); }
    .prod-row:hover td { background: var(--hover); }
    .prod-row.zero td { opacity: 0.35; }

    .prod-name { font-size: 12px; color: var(--text-sub); padding-left: 18px; }

    /* ── Sub rows (패키지 → 브랜드) ── */
    .sub-row { cursor: pointer; }
    .sub-name { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; color: var(--text); }
    .sub-row.expanded .toggle-icon { transform: rotate(90deg); }
    .prod-row.lvl3 .prod-name { padding-left: 36px; }

    /* ── Totals row ── */
    .totals-row td {
      padding: 13px 16px; background: #0C1525;
      border-top: 2px solid var(--accent);
      border-bottom: 2px solid var(--accent);
      vertical-align: middle;
    }
    .totals-label {
      font-size: 10px; font-weight: 700;
      letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-sub);
    }

    /* ── Total note (건수 제외 안내) ── */
    .total-note {
      font-size: 10px;
      color: var(--text-dim);
      font-family: 'Noto Sans KR', sans-serif;
      font-weight: 400;
      margin-top: 3px;
      letter-spacing: 0;
    }

    /* ── Number cells ── */
    .n {
      text-align: right;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px; color: var(--text); white-space: nowrap;
    }
    .n.strong { font-weight: 600; }
    .n.dim    { color: var(--text-dim); font-size: 11px; }

    /* ── Achievement cell ── */
    .ach {
      display: flex; flex-direction: column;
      align-items: flex-end; gap: 5px; padding-right: 2px;
    }

    .pct { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 600; }
    .pct.c-none  { color: var(--text-dim); }
    .pct.c-early { color: var(--warning); }
    .pct.c-mid   { color: var(--accent); }
    .pct.c-high  { color: var(--success); }
    .pct.c-done  { color: var(--gold); }

    .bar-track {
      width: 100%; height: 4px;
      background: rgba(255,255,255,0.05);
      border-radius: 2px; overflow: hidden;
    }
    .bar-fill {
      height: 100%; border-radius: 2px;
      transition: width 0.9s cubic-bezier(0.4,0,0.2,1);
    }
    .bar-fill.c-none  { background: var(--text-dim); }
    .bar-fill.c-early { background: var(--warning); }
    .bar-fill.c-mid   { background: var(--accent); }
    .bar-fill.c-high  { background: var(--success); }
    .bar-fill.c-done  { background: linear-gradient(90deg, var(--success), var(--gold)); }

    /* ── Pending (미집계중) ── */
    .pending-cell {
      color: var(--text-dim);
      font-size: 11px;
      font-family: 'Noto Sans KR', sans-serif;
      font-style: italic;
    }

    /* ── Section 2 ── */
    .s2-controls {
      display: flex; flex-wrap: wrap; align-items: center;
      gap: 8px; margin-bottom: 14px;
    }
    .s2-filters { display: flex; flex-wrap: wrap; gap: 6px; flex: 1; }
    .s2-metric  { display: flex; gap: 4px; flex-shrink: 0; }

    .filter-btn, .metric-btn {
      padding: 4px 12px;
      font-size: 10px; font-weight: 700;
      letter-spacing: 0.08em; text-transform: uppercase;
      border-radius: 20px; border: 1px solid var(--border);
      background: transparent; color: var(--text-dim);
      cursor: pointer; transition: all 0.15s;
    }
    .filter-btn.active { color: #fff; border-color: transparent; }
    .metric-btn.active { background: var(--surface-2); border-color: var(--border-soft); color: var(--text); }
    .filter-btn:hover:not(.active), .metric-btn:hover:not(.active) {
      border-color: var(--text-sub); color: var(--text-sub);
    }

    .chart-wrap {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 20px;
      position: relative; height: 280px;
    }
    #s2-chart-wrap { overflow-x: auto; overflow-y: hidden; -webkit-overflow-scrolling: touch; height: auto; }
    #s2-scroll-inner { display: flex; flex-direction: column; }
    #s2-chart-inner { height: 240px; }
    #trend-chart { cursor: grab; }

    #trial-chart-wrap { overflow-x: auto; overflow-y: hidden; -webkit-overflow-scrolling: touch; height: auto; }
    #trial-scroll-inner { display: flex; flex-direction: column; }
    #trial-chart-inner { height: 240px; }
    #trial-chart { cursor: grab; }

    #daypass-chart-wrap { overflow-x: auto; overflow-y: hidden; -webkit-overflow-scrolling: touch; height: auto; }
    #daypass-scroll-inner { display: flex; flex-direction: column; }
    #daypass-chart-inner { height: 240px; }
    #daypass-chart { cursor: grab; }

    /* ── 섹션2 타임라인 ── */
    #s2-timeline { position: relative; height: 68px; border-top: 1px solid rgba(255,255,255,0.06); }
    .tl-row { position: relative; height: 20px; margin-top: 2px; display: flex; align-items: center; }
    .tl-brand-label {
      position: sticky; left: 0; z-index: 20;
      background: var(--surface);
      height: 20px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: flex-end;
      padding-right: 6px;
      font-size: 9px; font-weight: 700; letter-spacing: 0.1em;
    }
    .tl-segment {
      position: absolute; top: 0; height: 20px;
      border-radius: 3px; border: 1px solid;
      display: flex; align-items: center; justify-content: center;
      font-size: 9px; font-weight: 700;
      overflow: hidden; white-space: nowrap;
    }

    /* ── Scoreboard (섹션3) ── */
    .scoreboard {
      display: flex; align-items: stretch;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px; margin-bottom: 12px; overflow: hidden;
    }
    .sb-cell { flex: 1; text-align: center; padding: 14px 12px; }
    .sb-divider { width: 1px; background: rgba(255,255,255,0.08); }
    .sb-label {
      font-size: 10px; font-weight: 700; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--text-dim); margin-bottom: 6px;
    }
    .sb-value { font-size: 20px; font-weight: 700; font-family: 'JetBrains Mono', monospace; }
    .sb-value.sb-blue { color: #3D7FFF; }
    .sb-value.sb-gray { color: #666; }
    .sb-ach { font-size: 11px; color: var(--text-dim); margin-top: 3px; }
    .sb-channel { font-size: 10px; color: var(--text-sub); margin-top: 4px; font-family: 'JetBrains Mono', monospace; }

    /* ── 섹션4 교차구매 ── */
    .s4-summary { font-size: 12px; color: var(--text-dim); }
    .s4-tables { display: flex; gap: 16px; overflow: hidden; }
    .s4-col { flex: 1; min-width: 0; }
    .s4-col-title {
      font-size: 10px; font-weight: 700; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--text-dim);
      margin-bottom: 8px;
    }
    .cross-table { width: 100%; min-width: 0; border-collapse: collapse; font-size: 13px; }
    .cross-table td:first-child { word-break: keep-all; }
    #s5-prod-tables .cross-table td:first-child { word-break: break-word; overflow-wrap: break-word; }
    .cross-table th {
      text-align: left; padding: 6px 8px;
      font-size: 10px; font-weight: 700; letter-spacing: 0.08em;
      color: var(--text-dim); border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .cross-table td { padding: 7px 8px; border-bottom: 1px solid rgba(255,255,255,0.04); }
    .cross-table td:nth-child(2), .cross-table td:nth-child(3) { text-align: right; }
    .cross-table td:nth-child(3) { color: var(--text-dim); font-size: 12px; }
    .cross-table tbody tr:hover td { background: var(--hover); }

    /* ── State ── */
    .state {
      display: flex; align-items: center; justify-content: center;
      min-height: 280px; gap: 10px;
      color: var(--text-sub); font-size: 13px;
    }
    .spinner {
      width: 15px; height: 15px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.65s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Table hint ── */
    .table-hint {
      font-size: 11px;
      color: var(--text-dim);
      margin-bottom: 8px;
      letter-spacing: 0.02em;
    }

    /* ── Mobile ── */
    /* ── Section 6 monthly table ── */
    .s6-group-th {
      text-align: center;
      border-right: 1px solid var(--border);
    }
    #s6-table-wrap table { min-width: unset; }

    /* ── Target comparison cell (V2 mode) ── */
    .tgt-old {
      display: block;
      font-size: 10px;
      color: var(--text-dim);
      line-height: 1.2;
      text-decoration: line-through;
    }
    .tgt-arrow {
      display: inline-block;
      font-size: 9px;
      color: var(--warning);
      margin: 0 3px;
      vertical-align: middle;
    }

    @media (max-width: 640px) {
      body { padding: 20px 14px 40px; }

      .brand-info h1 { font-size: 16px; white-space: nowrap; }
      .header-meta .timestamp { font-size: 10px; }
      .header { margin-bottom: 24px; padding-bottom: 16px; }

      html, body { font-size: 11px; }

      thead th { padding: 8px 10px; }
      .cat-row td, .prod-row td, .totals-row td { padding: 9px 10px; }
      .cat-prefix { font-size: 9px; }
      .cat-name { font-size: 11px; }
      .n { font-size: 11px; }
      thead th.col-name { min-width: 140px; }
      thead th.col-prog { min-width: 100px; }

      .s2-controls { flex-direction: column; align-items: flex-start; gap: 6px; }
      .s2-filters { flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; width: 100%; padding-bottom: 4px; }
      .filter-btn { white-space: nowrap; flex-shrink: 0; padding: 4px 10px; font-size: 9px; }
      .metric-btn { padding: 4px 10px; font-size: 9px; }

      .s4-tables { flex-direction: column; gap: 16px; }
      .s4-col-title { font-size: 9px; margin-bottom: 5px; }
      .s4-summary { font-size: 10px; }
      .cross-table { font-size: 10px; }
      .cross-table th { font-size: 8px; padding: 4px 5px; }
      .cross-table td { padding: 4px 5px; }
      .cross-table td:nth-child(3) { font-size: 9px; }
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-brand">
      <div class="brand-dot"></div>
      <div class="brand-info">
        <div class="location">마포 클럽하우스</div>
        <h1>프리세일 판매 현황</h1>
      </div>
    </div>
    <div class="header-meta">
      <div class="label">DB 업데이트</div>
      <div class="timestamp" id="updated-at">—</div>
    </div>
  </div>

  <div class="section-label"><span class="sl-num">01</span><span class="sl-title">월별/주차별 판매 현황</span></div>
  <p class="table-hint">▶ 행을 클릭하면 개별 상품 현황을 자세히 볼 수 있어요 · 건수 / VAT 제외 금액 기준 · 7/17 이후 결제</p>
  <div class="s2-metric" style="margin-bottom:10px">
    <button class="metric-btn active" id="s6-monthly-btn" onclick="setS6ViewMode('monthly')">월별</button>
    <button class="metric-btn"        id="s6-weekly-btn"  onclick="setS6ViewMode('weekly')">주별</button>
  </div>
  <div class="table-wrap" id="s6-table-wrap">
    <div class="state"><div class="spinner"></div><span>데이터 불러오는 중...</span></div>
  </div>

  <div class="section-label" style="margin-top: 40px"><span class="sl-num">02</span><span class="sl-title">일별 판매 추이 (RP · 사우나only)</span></div>
  <div class="s2-controls">
    <div class="s2-filters" id="s2-filters"></div>
    <div class="s2-metric">
      <button class="metric-btn active" id="m-count"   onclick="setMetric('count')">건수</button>
      <button class="metric-btn"        id="m-revenue" onclick="setMetric('revenue')">매출</button>
    </div>
  </div>
  <div class="chart-wrap" id="s2-chart-wrap">
    <div id="s2-scroll-inner">
      <div id="s2-chart-inner">

  <div class="section-label" style="margin-top: 40px"><span class="sl-num">04</span><span class="sl-title">런포트 1일권 판매 추이</span></div>
  <div class="s2-controls">
    <div class="s2-metric">
      <button class="metric-btn active" id="daypass-m-count"   onclick="setDaypassMetric('count')">건수</button>
      <button class="metric-btn"        id="daypass-m-revenue" onclick="setDaypassMetric('revenue')">매출</button>

  <script>
    const REFRESH_MS = 600000;
    var SCRIPT_URL = 'https://script.google.com/a/macros/butfitseoul.com/s/AKfycbwrqSx4JIFCbq__IZGVQuVGK4aGaIYcogvWVULTQmLgTXcoPPre7uIPfKs1xG4_qtk/exec';

    // BG/TB/RP 타임라인 데이터
    const TIMELINE_DATA = [
      { brand: 'BG', color: '#1FD49A', phases: [
        {                        end: '2026-04-22', label: '0차' },
        { start: '2026-04-23',  end: '2026-05-06', label: '1차' },
        { start: '2026-05-07',  end: '2026-05-20', label: '2차' },
        { start: '2026-05-21',  end: '2026-06-19', label: '3차' },
        { start: '2026-06-20',  end: '2026-06-30', label: '4차' },
        { start: '2026-07-01',  end: '2026-07-20', label: '5차' },
        { start: '2026-07-21',                      label: '정규' },
      ]},
      { brand: 'TB', color: '#1ABFBA', phases: [
        {                        end: '2026-05-12', label: '0차' },
        { start: '2026-05-13',  end: '2026-05-25', label: '1차' },
        { start: '2026-05-26',  end: '2026-06-19', label: '2차' },
        { start: '2026-06-22',  end: '2026-07-20', label: '3차' },
        { start: '2026-07-21',                      label: '정규' },
      ]},
      { brand: 'RP', color: '#3D7FFF', phases: [
        { start: '2026-05-06',  end: '2026-05-12', label: '1차' },
        { start: '2026-05-13',  end: '2026-05-22', label: '2차' },
        { start: '2026-05-26',  end: '2026-06-19', label: '3차' },
        { start: '2026-06-20',  end: '2026-07-20', label: '4차' },
        { start: '2026-07-21',                      label: '정규' },
      ]},
    ];

    // 카테고리별 차트 색상 + 표 밴드 (카테고리 구조는 Code.gs DASH_GROUPS가 내려줌)
    const CAT_STYLE = {
      '런포트 1일권(1회권)': { color: '#F7C46A', band: 'band-trial' },
      '런포트 체험권':       { color: '#FB7185', band: 'band-pt-trial' },
      '런포트 횟수권':       { color: '#3D7FFF', band: 'band-rp-pkg' },
      '런포트 구독권':       { color: '#7AABFF', band: 'band-rp-pkg' },
      '런포트 단체':         { color: '#22D3EE', band: 'band-rp-pkg' },
      '패키지':              { color: '#6366F1', band: 'band-rp-pkg' },
      '사우나 only':         { color: '#94A3B8', band: 'band-gray' },
      '버핏그라운드 멤버십': { color: '#86EFAC', band: 'band-bg-mem' },
      '버핏그라운드 1일권':  { color: '#86EFAC', band: 'band-bg-mem' },
      'BG단체':              { color: '#86EFAC', band: 'band-bg-mem' },
      'PT':                  { color: '#F97316', band: 'band-pt' },
      'PT체험권':            { color: '#F97316', band: 'band-pt' },
      '팀버핏 멤버십':       { color: '#C084FC', band: 'band-tb' },
      '팀버핏 체험권':       { color: '#C084FC', band: 'band-tb' },
      '팀버핏 1일권':        { color: '#C084FC', band: 'band-tb' },
      '미분류':              { color: '#6B7280', band: 'band-gray' },
    };
    const SUB_STYLE = {
      '런포트 패키지':       { color: '#3D7FFF', band: 'band-rp-pkg' },
      '버핏그라운드 패키지': { color: '#1FD49A', band: 'band-bg-pkg' },
      '팀버핏 패키지':       { color: '#8B5CF6', band: 'band-tb-pkg' },
    };
    function catColor(c) { return (CAT_STYLE[c] || {}).color || '#888'; }
    function catBand(c)  { return (CAT_STYLE[c] || {}).band  || ''; }

    const S2_GROUPS       = ['RP', '사우나only'];  // 섹션2 대상 그룹
    const TRIAL_CATEGORY  = '런포트 체험권';        // 섹션3
    const DAYPASS_CATEGORY = '런포트 1일권(1회권)'; // 섹션4

    var lastDash   = null;
    var s6ViewMode = 'monthly';

    // ── 공통 유틸 ─────────────────────────────────────────────
    function fmtN(n) {
      return (n !== null && n !== undefined) ? n.toLocaleString('ko-KR') : null;
    }

    function dash() {
      return '<span style="color:var(--text-dim);font-family:\'JetBrains Mono\',monospace">—</span>';
    }

    function todayKST() {
      var now = new Date(); now.setHours(now.getHours() + 9);
      return now.toISOString().substring(0, 10);
    }

    // since ~ 오늘 전체 날짜 (빈 날짜 포함, 매일 자동 연장)
    function dateRange(since) {
      var out = [], cur = new Date(since + 'T00:00:00Z'), last = todayKST();
      while (cur.toISOString().substring(0, 10) <= last) {
        out.push(cur.toISOString().substring(0, 10));
        cur.setUTCDate(cur.getUTCDate() + 1);
      }
      return out;
    }

    function findCat(name) {
      var hit = null;
      (lastDash.groups || []).forEach(function(g) {
        g.cats.forEach(function(c) { if (c.name === name) hit = c; });
      });
      return hit;
    }

    // 카테고리 하위 상품 전체 (패키지는 브랜드별 상품 합침)
    function catProducts(cat) {
      if (cat.subs) return cat.subs.reduce(function(a, s) { return a.concat(s.products); }, []);
      return cat.products || [];
    }

    // 하루치 값: 카테고리 / 상품 목록 합
    function dayCat(date, catName, metric) {
      var e = lastDash.daily[date] && lastDash.daily[date][catName];
      return e ? (metric === 'revenue' ? e.r : e.c) : 0;
    }
    function dayProds(date, catName, prods, metric) {
      var e = lastDash.daily[date] && lastDash.daily[date][catName];
      if (!e) return 0;
      return prods.reduce(function(sum, p) {
        var v = e.p[p]; return sum + (v ? (metric === 'revenue' ? v[1] : v[0]) : 0);
      }, 0);
    }

    function genShades(hex, count) {
      if (count <= 1) return [hex];
      var r = parseInt(hex.slice(1,3), 16);
      var g = parseInt(hex.slice(3,5), 16);
      var b = parseInt(hex.slice(5,7), 16);
      var shades = [];
      for (var i = 0; i < count; i++) {
        var t = i / (count - 1) * 0.55;
        var nr = Math.round(r + (255 - r) * t);
        var ng = Math.round(g + (255 - g) * t);
        var nb = Math.round(b + (255 - b) * t);
        shades.push('rgb(' + nr + ',' + ng + ',' + nb + ')');
      }
      return shades;
    }

    // ── 섹션1: 월별/주차별 판매 현황 ─────────────────────────────
    function getWeekStart(dateStr) {
      var d    = new Date(dateStr + 'T00:00:00Z');
      var day  = d.getUTCDay(); // 0=일, 1=월
      var diff = day === 0 ? -6 : 1 - day;
      return new Date(d.getTime() + diff * 86400000).toISOString().substring(0, 10);
    }

    function weekStartToLabel(ws) {
      var mon = new Date(ws + 'T00:00:00Z');
      var sun = new Date(mon.getTime() + 6 * 86400000);
      return (mon.getUTCMonth()+1) + '/' + mon.getUTCDate()
           + '~' + (sun.getUTCMonth()+1) + '/' + sun.getUTCDate();
    }

    function monthLabel(m) { return parseInt(m.split('-')[1], 10) + '월'; }

    // 기간(월/주)별 집계: agg.cat[cat][period], agg.prod[cat][상품][period] = {c, r}
    function aggregatePeriods(periodOf) {
      var periods = {}, agg = { cat: {}, prod: {} };
      function add(slot, key, per, c, r) {
        var o = slot[key] || (slot[key] = {});
        var v = o[per] || (o[per] = { c: 0, r: 0 });
        v.c += c; v.r += r;
      }
      Object.keys(lastDash.daily).forEach(function(date) {
        var per = periodOf(date);
        periods[per] = true;
        var day = lastDash.daily[date];
        Object.keys(day).forEach(function(catName) {
          var e = day[catName];
          add(agg.cat, catName, per, e.c, e.r);
          var pslot = agg.prod[catName] || (agg.prod[catName] = {});
          Object.keys(e.p).forEach(function(p) { add(pslot, p, per, e.p[p][0], e.p[p][1]); });
        });
      });
      agg.periods = Object.keys(periods).sort();
      return agg;
    }

    function setS6ViewMode(mode) {
      s6ViewMode = mode;
      document.getElementById('s6-monthly-btn').classList.toggle('active', mode === 'monthly');
      document.getElementById('s6-weekly-btn').classList.toggle('active',  mode === 'weekly');
      if (lastDash) renderSection1();
    }

    function renderSection1() {
      var wrap = document.getElementById('s6-table-wrap');
      var weekly = s6ViewMode === 'weekly';
      var agg = aggregatePeriods(weekly ? getWeekStart : function(d) { return d.substring(0, 7); });
      var periods = agg.periods;
      if (periods.length === 0) {
        wrap.innerHTML = '<div class="state" style="min-height:60px">데이터가 없습니다.</div>';
        return;
      }
      var labelFn  = weekly ? weekStartToLabel : monthLabel;
      var totalCols = 1 + 2 + periods.length * 2;

      function vatMinus(rev) { return Math.round(rev / 1.1); }
      function cellPair(c, r) {
        if (!c) {
          return '<td class="n dim">' + dash() + '</td>'
            + '<td class="n dim" style="border-right:1px solid var(--border)">' + dash() + '</td>';
        }
        return '<td class="n">' + c.toLocaleString('ko-KR') + '</td>'
          + '<td class="n" style="border-right:1px solid var(--border)">' + fmtN(vatMinus(r)) + '</td>';
      }
      // byPer 목록을 합쳐 [합계, 기간별...] 셀 생성
      function cells(byPerList) {
        var tot = { c: 0, r: 0 }, html = '';
        var per = periods.map(function(p) {
          var v = { c: 0, r: 0 };
          byPerList.forEach(function(bp) { if (bp && bp[p]) { v.c += bp[p].c; v.r += bp[p].r; } });
          tot.c += v.c; tot.r += v.r;
          return v;
        });
        html += cellPair(tot.c, tot.r);
        per.forEach(function(v) { html += cellPair(v.c, v.r); });
        return { html: html, total: tot };
      }

      var thead = '<thead><tr>'
        + '<th class="col-name" rowspan="2">판매상품</th>'
        + '<th colspan="2" class="s6-group-th">합계</th>';
      periods.forEach(function(p) { thead += '<th colspan="2" class="s6-group-th">' + labelFn(p) + '</th>'; });
      thead += '</tr><tr><th>건수</th><th style="border-right:1px solid var(--border)">금액 (VAT-)</th>';
      periods.forEach(function() { thead += '<th>건수</th><th style="border-right:1px solid var(--border)">금액 (VAT-)</th>'; });
      thead += '</tr></thead>';

      var tbody = '<tbody>', rowId = 0;
      function prodRows(catName, prods, band, parentAttr, rootId, indentCls) {
        var html = '';
        prods.forEach(function(p, i) {
          var pc = cells([(agg.prod[catName] || {})[p]]);
          html += '<tr class="prod-row ' + (indentCls || '') + (pc.total.c === 0 ? ' zero ' : ' ') + band
            + (i === prods.length - 1 ? ' last-in-group' : '') + '" ' + parentAttr + ' data-cat-root="' + rootId + '" style="display:none">'
            + '<td class="col-name"><span class="prod-name">└ ' + p + '</span></td>' + pc.html + '</tr>';
        });
        return html;
      }

      lastDash.groups.forEach(function(g) {
        tbody += '<tr class="group-header-row"><td colspan="' + totalCols + '"><span class="group-label">'
          + g.group + '</span></td></tr>';
        g.cats.forEach(function(cat) {
          var catId = 's1-cat-' + (rowId++);
          var band  = catBand(cat.name);
          var cc    = cells([(agg.cat || {})[cat.name]]);
          tbody += '<tr class="cat-row ' + band + '" data-cat-id="' + catId + '">'
            + '<td class="col-name"><span class="cat-name"><span class="toggle-icon">▶</span>'
            + '<span class="cat-text">' + cat.name + '</span></span></td>' + cc.html + '</tr>';

          if (cat.subs) {
            cat.subs.forEach(function(sub) {
              var subId   = 's1-sub-' + (rowId++);
              var subBand = (SUB_STYLE[sub.name] || {}).band || band;
              var sc = cells(sub.products.map(function(p) { return (agg.prod[cat.name] || {})[p]; }));
              tbody += '<tr class="prod-row sub-row ' + (sc.total.c === 0 ? 'zero ' : '') + subBand + '" data-cat-parent="' + catId
                + '" data-cat-root="' + catId + '" data-sub-id="' + subId + '" style="display:none">'
                + '<td class="col-name"><span class="prod-name sub-name"><span class="toggle-icon">▶</span>' + sub.name + '</span></td>'
                + sc.html + '</tr>';
              tbody += prodRows(cat.name, sub.products, subBand, 'data-sub-parent="' + subId + '"', catId, 'lvl3');
            });
          } else {
            tbody += prodRows(cat.name, cat.products || [], band, 'data-cat-parent="' + catId + '"', catId, '');
          }
        });
      });
      tbody += '</tbody>';
      wrap.innerHTML = '<table>' + thead + tbody + '</table>';
    }

    // 펼침/접힘: 카테고리 → (패키지 브랜드) → 상품
    document.getElementById('s6-table-wrap').addEventListener('click', function(e) {
      var sub = e.target.closest('tr.sub-row');
      if (sub) {
        var subOpen = sub.classList.toggle('expanded');
        document.querySelectorAll('[data-sub-parent="' + sub.dataset.subId + '"]').forEach(function(r) {
          r.style.display = subOpen ? '' : 'none';
        });
        return;
      }
      var row = e.target.closest('tr.cat-row');
      if (!row || !row.dataset.catId) return;
      var catId = row.dataset.catId;
      var isExpanded = row.classList.toggle('expanded');
      if (isExpanded) {
        document.querySelectorAll('[data-cat-parent="' + catId + '"]').forEach(function(r) { r.style.display = ''; });
      } else {
        document.querySelectorAll('[data-cat-root="' + catId + '"]').forEach(function(r) {
          r.style.display = 'none';
          r.classList.remove('expanded');
        });
      }
    });

    // ── 차트 공통 플러그인 ─────────────────────────────────────
    function todayLinePlugin(id, allDates) {
      var today = todayKST();
      return {
        id: id,
        afterDraw: function(chart) {
          var idx = allDates.indexOf(today);
          if (idx < 0) return;
          var xScale = chart.scales.x, yScale = chart.scales.y, ctx2 = chart.ctx;
          var x = xScale.getPixelForValue(idx);
          ctx2.save();
          ctx2.strokeStyle = 'rgba(255,90,80,0.65)';
          ctx2.setLineDash([4, 4]);
          ctx2.lineWidth = 1;
          ctx2.beginPath();
          ctx2.moveTo(x, yScale.top);
          ctx2.lineTo(x, yScale.bottom);
          ctx2.stroke();
          ctx2.setLineDash([]);
          ctx2.fillStyle = 'rgba(255,110,100,0.9)';
          ctx2.font = '10px "Noto Sans KR"';
          ctx2.textAlign = 'left';
          ctx2.fillText('오늘', x + 4, yScale.top + 14);
          ctx2.restore();
        }
      };
    }

    // 막대 위 합계 레이블
    function stackTotalsPlugin(id, metric) {
      return {
        id: id,
        afterDatasetsDraw: function(chart) {
          var ctx2 = chart.ctx, dsCount = chart.data.datasets.length;
          if (dsCount === 0) return;
          chart.data.labels.forEach(function(_, i) {
            var total = chart.data.datasets.reduce(function(sum, ds) { return sum + (ds.data[i] || 0); }, 0);
            if (!total) return;
            var lastMeta = chart.getDatasetMeta(dsCount - 1);
            if (!lastMeta.data[i]) return;
            ctx2.save();
            ctx2.font = "9px 'JetBrains Mono', monospace";
            ctx2.fillStyle = '#8A9DC0';
            ctx2.textAlign = 'center';
            ctx2.textBaseline = 'bottom';
            ctx2.fillText(metric === 'revenue' ? Math.round(total / 10000) + '만' : String(total),
              lastMeta.data[i].x, lastMeta.data[i].y - 4);
            ctx2.restore();
          });
        }
      };
    }

    // 스택 바차트 생성 (섹션2·3·4 공용)
    function drawBarChart(opt) {
      var allDates = dateRange(lastDash.since);
      var wrap = document.getElementById(opt.wrapId);
      var barW = window.innerWidth <= 640 ? 36 : 28;
      var minWidth = Math.max(wrap.clientWidth - 40, allDates.length * barW);
      document.getElementById(opt.scrollInnerId).style.width = minWidth + 'px';

      var datasets = opt.series.map(function(s) {
        return {
          label: s.label,
          data: allDates.map(s.value),
          backgroundColor: s.color,
          borderRadius: 2, borderSkipped: false,
        };
      });
      var metric = opt.metric;
      var gridColor = 'rgba(255,255,255,0.04)', tickColor = '#3A4F6A', mono = "'JetBrains Mono', monospace";

      if (opt.prevChart) opt.prevChart.destroy();
      var chart = new Chart(document.getElementById(opt.canvasId), {
        type: 'bar',
        data: { labels: allDates.map(function(d) { return d.substring(5); }), datasets: datasets },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: {
            legend: {
              display: datasets.length > 1, position: 'top',
              labels: { color: tickColor, font: { size: 10 }, boxWidth: 10, padding: 12 }
            },
            tooltip: {
              mode: 'index',
              callbacks: {
                label: function(ctx) {
                  var v = ctx.parsed.y;
                  return ' ' + ctx.dataset.label + ': ' + (metric === 'revenue' ? v.toLocaleString('ko-KR') + '원' : v + '건');
                }
              }
            }
          },
          scales: {
            x: { stacked: true, grid: { color: gridColor },
                 ticks: { color: tickColor, font: { family: mono, size: 10 }, maxRotation: 45 } },
            y: { stacked: true, grid: { color: gridColor },
                 ticks: { color: tickColor, font: { family: mono, size: 10 },
                          callback: metric === 'revenue' ? function(v) { return (v / 10000).toFixed(0) + '만'; } : undefined } }
          }
        },
        plugins: [stackTotalsPlugin('totals-' + opt.canvasId, metric), todayLinePlugin('today-' + opt.canvasId, allDates)]
      });

      // 오늘 날짜가 viewport 중앙에 오도록 자동 스크롤
      var todayIdx = allDates.indexOf(todayKST());
      if (todayIdx >= 0) {
        wrap.scrollLeft = Math.max(0, chart.scales.x.getPixelForValue(todayIdx) - wrap.clientWidth / 2);
      } else {
        wrap.scrollLeft = wrap.scrollWidth;
      }
      if (opt.afterDraw) opt.afterDraw(chart, allDates);
      return chart;
    }

    // 카테고리 1개 → 상품별(패키지는 브랜드별) 시리즈
    function catBreakdownSeries(catName, metric) {
      var cat = findCat(catName);
      if (!cat) return [];
      if (cat.subs) {
        return cat.subs.map(function(sub) {
          return { label: sub.name, color: (SUB_STYLE[sub.name] || {}).color || '#888',
                   value: function(d) { return dayProds(d, catName, sub.products, metric); } };
        });
      }
      var prods = cat.products || [];
      var shades = genShades(catColor(catName), prods.length);
      return prods.map(function(p, i) {
        return { label: p, color: shades[i], value: function(d) { return dayProds(d, catName, [p], metric); } };
      });
    }

    // ── 섹션2: 일별 판매 추이 (RP · 사우나only) ───────────────────
    var trendChart = null;
    var s2Metric   = 'count';
    var s2Filter   = '전체';

    function s2Cats() {
      var out = [];
      lastDash.groups.forEach(function(g) {
        if (S2_GROUPS.indexOf(g.group) >= 0) g.cats.forEach(function(c) { out.push(c.name); });
      });
      return out;
    }

    function setMetric(m) {
      s2Metric = m;
      document.getElementById('m-count').classList.toggle('active',   m === 'count');
      document.getElementById('m-revenue').classList.toggle('active', m === 'revenue');
      if (lastDash) buildChart();
    }

    function setS2Filter(catName) {
      s2Filter = catName;
      document.querySelectorAll('#s2-filters .filter-btn').forEach(function(b) {
        var isActive = b.dataset.cat === catName;
        b.classList.toggle('active', isActive);
        if (b.dataset.cat !== '전체') {
          b.style.backgroundColor = isActive ? catColor(b.dataset.cat) : '';
          b.style.color           = isActive ? '#fff' : catColor(b.dataset.cat);
        }
      });
      if (lastDash) buildChart();
    }

    function makeFilterBtn(catName, isActive) {
      var btn = document.createElement('button');
      btn.className   = 'filter-btn' + (isActive ? ' active' : '');
      btn.dataset.cat = catName;
      btn.textContent = catName;
      if (catName !== '전체') {
        btn.style.borderColor     = catColor(catName);
        btn.style.color           = isActive ? '#fff' : catColor(catName);
        btn.style.backgroundColor = isActive ? catColor(catName) : '';
      }
      btn.onclick = function() { setS2Filter(catName); };
      return btn;
    }

    function renderSection2() {
      var container = document.getElementById('s2-filters');
      container.innerHTML = '';
      container.appendChild(makeFilterBtn('전체', s2Filter === '전체'));
      s2Cats().forEach(function(c) { container.appendChild(makeFilterBtn(c, s2Filter === c)); });
      buildChart();
    }

    function buildChart() {
      var metric = s2Metric;
      var series = s2Filter === '전체'
        ? s2Cats().map(function(c) {
            return { label: c, color: catColor(c), value: function(d) { return dayCat(d, c, metric); } };
          })
        : catBreakdownSeries(s2Filter, metric);
      trendChart = drawBarChart({
        series: series, metric: metric, prevChart: trendChart,
        canvasId: 'trend-chart', wrapId: 's2-chart-wrap', scrollInnerId: 's2-scroll-inner',
        afterDraw: function(chart, allDates) { buildTimeline(chart, allDates); }
      });
    }

    function buildTimeline(chart, allDates) {
      var container = document.getElementById('s2-timeline');
      container.innerHTML = '';
      if (!TIMELINE_DATA.length || allDates.length < 2) return;

      var xScale    = chart.scales.x;
      var n         = allDates.length;
      var barHalf   = (xScale.getPixelForValue(1) - xScale.getPixelForValue(0)) / 2;
      var plotLeft  = xScale.getPixelForValue(0)     - barHalf;
      var plotRight = xScale.getPixelForValue(n - 1) + barHalf;
      var yAxisW    = plotLeft;

      var chartFirst = allDates[0];
      var chartLast  = allDates[n - 1];

      function startX(dateStr) {
        if (!dateStr || dateStr <= chartFirst) return plotLeft;
        if (dateStr > chartLast) return plotRight;
        var idx = allDates.indexOf(dateStr);
        return idx >= 0 ? xScale.getPixelForValue(idx) - barHalf : plotLeft;
      }

      function endX(dateStr) {
        if (!dateStr || dateStr >= chartLast) return plotRight;
        if (dateStr < chartFirst) return plotLeft;
        var idx = allDates.indexOf(dateStr);
        return idx >= 0 ? xScale.getPixelForValue(idx) + barHalf : plotRight;
      }

      TIMELINE_DATA.forEach(function(tl) {
        var row = document.createElement('div');
        row.className = 'tl-row';

        var lbl = document.createElement('div');
        lbl.className    = 'tl-brand-label';
        lbl.textContent  = tl.brand;
        lbl.style.color  = tl.color;
        lbl.style.width  = yAxisW + 'px';
        row.appendChild(lbl);

        var rc = parseInt(tl.color.slice(1,3), 16);
        var gc = parseInt(tl.color.slice(3,5), 16);
        var bc = parseInt(tl.color.slice(5,7), 16);

        tl.phases.forEach(function(phase) {
          var phEnd   = phase.end   || chartLast;
          var phStart = phase.start || '';
          if (phEnd < chartFirst) return;
          if (phStart && phStart > chartLast) return;

          var lx = phStart ? startX(phStart) : plotLeft;
          var rx = endX(phEnd);
          var w  = rx - lx;
          if (w < 4) return;

          var seg = document.createElement('div');
          seg.className             = 'tl-segment';
          seg.style.left            = lx + 'px';
          seg.style.width           = w  + 'px';
          seg.style.backgroundColor = 'rgba(' + rc + ',' + gc + ',' + bc + ',0.15)';
          seg.style.borderColor     = 'rgba(' + rc + ',' + gc + ',' + bc + ',0.45)';
          seg.style.color           = tl.color;
          seg.textContent           = phase.label;
          row.appendChild(seg);
        });

        container.appendChild(row);
      });
    }

    // ── 섹션3: 런포트 체험권 / 섹션4: 런포트 1일권 ──────────────────
    var trialChart = null,   trialMetric = 'count';
    var daypassChart = null, daypassMetric = 'count';

    function renderTrialSection() {
      trialChart = drawBarChart({
        series: catBreakdownSeries(TRIAL_CATEGORY, trialMetric), metric: trialMetric, prevChart: trialChart,
        canvasId: 'trial-chart', wrapId: 'trial-chart-wrap', scrollInnerId: 'trial-scroll-inner'
      });
    }

    function renderDaypassSection() {
      daypassChart = drawBarChart({
        series: catBreakdownSeries(DAYPASS_CATEGORY, daypassMetric), metric: daypassMetric, prevChart: daypassChart,
        canvasId: 'daypass-chart', wrapId: 'daypass-chart-wrap', scrollInnerId: 'daypass-scroll-inner'
      });
    }

    function setTrialMetric(m) {
      trialMetric = m;
      document.getElementById('trial-m-count').classList.toggle('active',   m === 'count');
      document.getElementById('trial-m-revenue').classList.toggle('active', m === 'revenue');
      if (lastDash) renderTrialSection();
    }

    function setDaypassMetric(m) {
      daypassMetric = m;
      document.getElementById('daypass-m-count').classList.toggle('active',   m === 'count');
      document.getElementById('daypass-m-revenue').classList.toggle('active', m === 'revenue');
      if (lastDash) renderDaypassSection();
    }

    // ── 로드 ─────────────────────────────────────────────────
    function render(data) {
      lastDash = data;
      var ts = document.getElementById('updated-at');
      ts.textContent = data.dbUpdatedAt
        ? data.dbUpdatedAt.substring(5).replace('-', '/')
        : new Date(data.updatedAt).toLocaleString('ko-KR', { timeZone: 'Asia/Seoul', hour12: false });
      renderSection1();
      renderSection2();
      renderTrialSection();
      renderDaypassSection();
    }

    function showError(msg) {
      ['s6-table-wrap', 's2-chart-wrap'].forEach(function(id) {
        document.getElementById(id).innerHTML = '<div class="state">⚠️ &nbsp;' + msg + '</div>';
      });
    }

    function load() {
      fetch(SCRIPT_URL)
        .then(function(res) { return res.json(); })
        .then(function(data) {
          if (data.error) { showError(data.error); return; }
          if (!data.groups || !data.daily) { showError('데이터 형식 오류: Code.gs 재배포가 필요합니다.'); return; }
          try { render(data); } catch (e) { showError('렌더링 오류: ' + e.message); }
        })
        .catch(function(err) { showError('로드 실패: ' + (err.message || err)); });
    }

    (function cycle() {
      load();
      setTimeout(cycle, REFRESH_MS);
    })();

    // 섹션4 체험권 차트 드래그/스와이프
    (function() {
      var c = document.getElementById('trial-chart');
      var w = document.getElementById('trial-chart-wrap');

      var tStartX = 0, tScrollLeft = 0;
      c.addEventListener('touchstart', function(e) {
        tStartX     = e.touches[0].clientX;
        tScrollLeft = w.scrollLeft;
      }, { passive: true });
      c.addEventListener('touchmove', function(e) {
        e.preventDefault();
        w.scrollLeft = tScrollLeft + (tStartX - e.touches[0].clientX);
      }, { passive: false });

      var mStartX = 0, mScrollLeft = 0, dragging = false;
      c.addEventListener('mousedown', function(e) {
        dragging = true; mStartX = e.clientX; mScrollLeft = w.scrollLeft;
        c.style.cursor = 'grabbing';
        if (trialChart) { trialChart.options.plugins.tooltip.enabled = false; trialChart.update('none'); }
        e.preventDefault();
      });
      document.addEventListener('mousemove', function(e) {
        if (!dragging) return;
        w.scrollLeft = mScrollLeft - (e.clientX - mStartX);
      });
      document.addEventListener('mouseup', function() {
        if (!dragging) return;
        dragging = false; c.style.cursor = 'grab';
        if (trialChart) { trialChart.options.plugins.tooltip.enabled = true; trialChart.update('none'); }
      });
    })();

    // 섹션5 일일권 차트 드래그/스와이프
    (function() {
      var c = document.getElementById('daypass-chart');
      var w = document.getElementById('daypass-chart-wrap');

      var tStartX = 0, tScrollLeft = 0;
      c.addEventListener('touchstart', function(e) {
        tStartX     = e.touches[0].clientX;
        tScrollLeft = w.scrollLeft;
      }, { passive: true });
      c.addEventListener('touchmove', function(e) {
        e.preventDefault();
        w.scrollLeft = tScrollLeft + (tStartX - e.touches[0].clientX);
      }, { passive: false });

      var mStartX = 0, mScrollLeft = 0, dragging = false;
      c.addEventListener('mousedown', function(e) {
        dragging = true; mStartX = e.clientX; mScrollLeft = w.scrollLeft;
        c.style.cursor = 'grabbing';
        if (daypassChart) { daypassChart.options.plugins.tooltip.enabled = false; daypassChart.update('none'); }
        e.preventDefault();
      });
      document.addEventListener('mousemove', function(e) {
        if (!dragging) return;
        w.scrollLeft = mScrollLeft - (e.clientX - mStartX);
      });
      document.addEventListener('mouseup', function() {
        if (!dragging) return;
        dragging = false; c.style.cursor = 'grab';
        if (daypassChart) { daypassChart.options.plugins.tooltip.enabled = true; daypassChart.update('none'); }
      });
    })();

    // 섹션2 차트 캔버스 스와이프/드래그 — Chart.js touch-action:none 우회
    (function() {
      var c = document.getElementById('trend-chart');
      var w = document.getElementById('s2-chart-wrap');

      // 터치 (모바일 스와이프)
      var tStartX = 0, tScrollLeft = 0;
      c.addEventListener('touchstart', function(e) {
        tStartX     = e.touches[0].clientX;
        tScrollLeft = w.scrollLeft;
      }, { passive: true });
      c.addEventListener('touchmove', function(e) {
        e.preventDefault();
        w.scrollLeft = tScrollLeft + (tStartX - e.touches[0].clientX);
      }, { passive: false });

      // 마우스 드래그 (데스크탑)
      var mStartX = 0, mScrollLeft = 0, dragging = false;
      c.addEventListener('mousedown', function(e) {
        dragging = true; mStartX = e.clientX; mScrollLeft = w.scrollLeft;
        c.style.cursor = 'grabbing';
        if (trendChart) { trendChart.options.plugins.tooltip.enabled = false; trendChart.update('none'); }
        e.preventDefault();
      });
      document.addEventListener('mousemove', function(e) {
        if (!dragging) return;
        w.scrollLeft = mScrollLeft - (e.clientX - mStartX);
      });
      document.addEventListener('mouseup', function() {
        if (!dragging) return;
        dragging = false; c.style.cursor = 'grab';
        if (trendChart) { trendChart.options.plugins.tooltip.enabled = true; trendChart.update('none'); }
      });
    })();
  </script>
</body>
