<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>마포 클럽하우스 판매 대시보드</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #07090F;
      --surface:      #0D1120;
      --surface-2:    #121828;
      --border:       #1C2540;
      --border-soft:  #141C30;
      --text:         #D0DCF0;
      --text-sub:     #8A9DC0;
      --text-dim:     #3A4F6A;
      --accent:       #3D7FFF;
      --success:      #1FD49A;
      --warning:      #F5A623;
      --gold:         #F5C842;
      --cat-bg:       #111828;
      --prod-bg:      #090C18;
      --hover:        #151F35;
    }

    html, body {
      height: 100%;
      font-family: 'Noto Sans KR', sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
      line-height: 1.5;
    }

    body { padding: 28px 32px 48px; }

    /* ── Header ── */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 36px;
      padding-bottom: 22px;
      border-bottom: 1px solid var(--border);
    }

    .header-brand { display: flex; align-items: center; gap: 14px; }

    .brand-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 12px var(--accent);
      flex-shrink: 0;
    }

    .brand-info .location {
      font-size: 11px; font-weight: 600;
      letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--accent); margin-bottom: 4px;
    }

    .brand-info h1 {
      font-size: 22px; font-weight: 700;
      letter-spacing: -0.03em; color: var(--text);
    }

    .header-meta { text-align: right; }

    .header-meta .label {
      font-size: 10px; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--text-dim); margin-bottom: 3px;
    }

    .header-meta .timestamp {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px; color: var(--text-sub);
    }

    /* ── Section label ── */
    .section-label {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 14px;
    }
    .section-label::after {
      content: ''; flex: 1; height: 1px; background: var(--border);
    }
    .sl-num {
      font-size: 10px; font-weight: 700; letter-spacing: 0.08em;
      color: var(--text-dim);
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2px 7px;
      white-space: nowrap;
    }
    .sl-title {
      font-size: 13px; font-weight: 700; letter-spacing: 0.02em;
      color: var(--text-sub);
      white-space: nowrap;
    }

    /* ── Table wrapper ── */
    .table-wrap {
      border-radius: 12px; border: 1px solid var(--border);
      overflow: hidden; overflow-x: auto;
    }

    table { width: 100%; min-width: 860px; border-collapse: collapse; }

    /* ── Table head ── */
    thead { position: sticky; top: 0; z-index: 10; }
    thead tr { background: var(--surface-2); }

    thead th {
      padding: 11px 16px;
      font-size: 10px; font-weight: 700;
      letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--text-dim); text-align: right; white-space: nowrap;
      border-bottom: 1px solid var(--border);
    }
    thead th.col-name { text-align: left; min-width: 200px; }
    thead th.col-prog { min-width: 130px; }

    /* ── Sticky first column ── */
    table td:first-child,
    table th.col-name { position: sticky; left: 0; z-index: 5; }
    thead th.col-name  { background: var(--surface-2); z-index: 15; }

    /* ── VAT sub-label in header ── */
    .vat-tag {
      display: block;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: var(--gold);
      margin-top: 2px;
      text-transform: uppercase;
    }

    /* ── Category rows ── */
    .cat-row { cursor: pointer; }
    .cat-row td {
      padding: 13px 16px; background: var(--cat-bg);
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border-soft);
      vertical-align: middle;
    }
    .cat-row td:first-child { border-left: 3px solid var(--accent); }
    .cat-row:hover td { background: var(--hover); }

    .cat-name {
      font-weight: 700; font-size: 13px; color: var(--text);
      display: flex; align-items: center; gap: 8px;
    }
    .cat-text { display: flex; flex-direction: column; gap: 2px; }
    .cat-prefix {
      font-size: 10px; font-weight: 600;
      letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--text-dim); line-height: 1;
    }

    /* ── Toggle icon ── */
    .toggle-icon {
      display: inline-block;
      font-size: 9px;
      flex-shrink: 0;
      color: var(--text-dim);
      transition: transform 0.2s ease;
    }
    .cat-row.expanded .toggle-icon { transform: rotate(90deg); }

    /* ── Band colors (브랜드 그룹별 배경) ── */
    /* RP — 파란색 */
    .cat-row.band-rp-pkg td,    .prod-row.band-rp-pkg td    { background: #0D1520; }
    .cat-row.band-rp-pkg td:first-child    { border-left-color: #3D7FFF; }
    .cat-row.band-rp-pkg:hover td, .prod-row.band-rp-pkg:hover td { background: var(--hover); }

    /* BG 패키지 — 녹색 */
    .cat-row.band-bg-pkg td,    .prod-row.band-bg-pkg td    { background: #0A1A14; }
    .cat-row.band-bg-pkg td:first-child    { border-left-color: #1FD49A; }
    .cat-row.band-bg-pkg:hover td, .prod-row.band-bg-pkg:hover td { background: var(--hover); }

    /* BG 멤버십 — 연두색 */
    .cat-row.band-bg-mem td,    .prod-row.band-bg-mem td    { background: #0A1A0C; }
    .cat-row.band-bg-mem td:first-child    { border-left-color: #86EFAC; }
    .cat-row.band-bg-mem:hover td, .prod-row.band-bg-mem:hover td { background: var(--hover); }

    /* PT — 주황색 */
    .cat-row.band-pt td,        .prod-row.band-pt td        { background: #1A0D07; }
    .cat-row.band-pt td:first-child        { border-left-color: #F97316; }
    .cat-row.band-pt:hover td,  .prod-row.band-pt:hover td  { background: var(--hover); }

    /* PT체험권 — 노란색 */
    .cat-row.band-pt-trial td,  .prod-row.band-pt-trial td  { background: #181508; }
    .cat-row.band-pt-trial td:first-child  { border-left-color: #FDE047; }
    .cat-row.band-pt-trial:hover td, .prod-row.band-pt-trial:hover td { background: var(--hover); }

    /* TB 패키지 — 보라색 */
    .cat-row.band-tb-pkg td,    .prod-row.band-tb-pkg td    { background: #130F1A; }
    .cat-row.band-tb-pkg td:first-child    { border-left-color: #8B5CF6; }
    .cat-row.band-tb-pkg:hover td, .prod-row.band-tb-pkg:hover td { background: var(--hover); }

    /* TB — 연보라색 */
    .cat-row.band-tb td,        .prod-row.band-tb td        { background: #120D1A; }
    .cat-row.band-tb td:first-child        { border-left-color: #C084FC; }
    .cat-row.band-tb:hover td,  .prod-row.band-tb:hover td  { background: var(--hover); }

    /* 기타 — 회색 */
    .cat-row.band-gray td,      .prod-row.band-gray td      { background: #111318; }
    .cat-row.band-gray td:first-child      { border-left-color: #6B7280; }
    .cat-row.band-gray:hover td, .prod-row.band-gray:hover td { background: var(--hover); }

    /* 체험/일일권 — 진한 노란색 */
    .cat-row.band-trial td, .prod-row.band-trial td { background: #181400; }
    .cat-row.band-trial td:first-child { border-left-color: #D97706; }
    .cat-row.band-trial:hover td, .prod-row.band-trial:hover td { background: var(--hover); }

    /* ── Group separator rows ── */
    .group-header-row td {
      background: rgba(255,255,255,0.05) !important;
      border-top: 1px solid rgba(255,255,255,0.08) !important;
      border-bottom: none !important;
      border-left: 3px solid rgba(255,255,255,0.25) !important;
      padding: 8px 14px;
    }
    .group-label {
      font-size: 10px; font-weight: 700; letter-spacing: 0.15em;
      color: #B0B8C8; text-transform: uppercase;
    }

    /* ── Product rows ── */
    .prod-row td {
      padding: 9px 16px; background: var(--prod-bg);
      border-bottom: 1px solid var(--border-soft);
      vertical-align: middle;
    }
    .prod-row.last-in-group td { border-bottom: 1px solid var(--border); }
    .prod-row:hover td { background: var(--hover); }
    .prod-row.zero td { opacity: 0.35; }

    .prod-name { font-size: 12px; color: var(--text-sub); padding-left: 18px; }

    /* ── Totals row ── */
    .totals-row td {
      padding: 13px 16px; background: #0C1525;
      border-top: 2px solid var(--accent);
      border-bottom: 2px solid var(--accent);
      vertical-align: middle;
    }
    .totals-label {
      font-size: 10px; font-weight: 700;
      letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-sub);
    }

    /* ── Total note (건수 제외 안내) ── */
    .total-note {
      font-size: 10px;
      color: var(--text-dim);
      font-family: 'Noto Sans KR', sans-serif;
      font-weight: 400;
      margin-top: 3px;
      letter-spacing: 0;
    }

    /* ── Number cells ── */
    .n {
      text-align: right;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px; color: var(--text); white-space: nowrap;
    }
    .n.strong { font-weight: 600; }
    .n.dim    { color: var(--text-dim); font-size: 11px; }

    /* ── Achievement cell ── */
    .ach {
      display: flex; flex-direction: column;
      align-items: flex-end; gap: 5px; padding-right: 2px;
    }

    .pct { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 600; }
    .pct.c-none  { color: var(--text-dim); }
    .pct.c-early { color: var(--warning); }
    .pct.c-mid   { color: var(--accent); }
    .pct.c-high  { color: var(--success); }
    .pct.c-done  { color: var(--gold); }

    .bar-track {
      width: 100%; height: 4px;
      background: rgba(255,255,255,0.05);
      border-radius: 2px; overflow: hidden;
    }
    .bar-fill {
      height: 100%; border-radius: 2px;
      transition: width 0.9s cubic-bezier(0.4,0,0.2,1);
    }
    .bar-fill.c-none  { background: var(--text-dim); }
    .bar-fill.c-early { background: var(--warning); }
    .bar-fill.c-mid   { background: var(--accent); }
    .bar-fill.c-high  { background: var(--success); }
    .bar-fill.c-done  { background: linear-gradient(90deg, var(--success), var(--gold)); }

    /* ── Pending (미집계중) ── */
    .pending-cell {
      color: var(--text-dim);
      font-size: 11px;
      font-family: 'Noto Sans KR', sans-serif;
      font-style: italic;
    }

    /* ── Section 2 ── */
    .s2-controls {
      display: flex; flex-wrap: wrap; align-items: center;
      gap: 8px; margin-bottom: 14px;
    }
    .s2-filters { display: flex; flex-wrap: wrap; gap: 6px; flex: 1; }
    .s2-metric  { display: flex; gap: 4px; flex-shrink: 0; }

    .filter-btn, .metric-btn {
      padding: 4px 12px;
      font-size: 10px; font-weight: 700;
      letter-spacing: 0.08em; text-transform: uppercase;
      border-radius: 20px; border: 1px solid var(--border);
      background: transparent; color: var(--text-dim);
      cursor: pointer; transition: all 0.15s;
    }
    .filter-btn.active { color: #fff; border-color: transparent; }
    .metric-btn.active { background: var(--surface-2); border-color: var(--border-soft); color: var(--text); }
    .filter-btn:hover:not(.active), .metric-btn:hover:not(.active) {
      border-color: var(--text-sub); color: var(--text-sub);
    }

    .chart-wrap {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 20px;
      position: relative; height: 280px;
    }
    #s2-chart-wrap { overflow-x: auto; overflow-y: hidden; -webkit-overflow-scrolling: touch; height: auto; }
    #s2-scroll-inner { display: flex; flex-direction: column; }
    #s2-chart-inner { height: 240px; }
    #trend-chart { cursor: grab; }

    #trial-chart-wrap { overflow-x: auto; overflow-y: hidden; -webkit-overflow-scrolling: touch; height: auto; }
    #trial-scroll-inner { display: flex; flex-direction: column; }
    #trial-chart-inner { height: 240px; }
    #trial-chart { cursor: grab; }

    /* ── 섹션2 타임라인 ── */
    #s2-timeline { position: relative; height: 68px; border-top: 1px solid rgba(255,255,255,0.06); }
    .tl-row { position: relative; height: 20px; margin-top: 2px; display: flex; align-items: center; }
    .tl-brand-label {
      position: sticky; left: 0; z-index: 20;
      background: var(--surface);
      height: 20px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: flex-end;
      padding-right: 6px;
      font-size: 9px; font-weight: 700; letter-spacing: 0.1em;
    }
    .tl-segment {
      position: absolute; top: 0; height: 20px;
      border-radius: 3px; border: 1px solid;
      display: flex; align-items: center; justify-content: center;
      font-size: 9px; font-weight: 700;
      overflow: hidden; white-space: nowrap;
    }

    /* ── Scoreboard (섹션3) ── */
    .scoreboard {
      display: flex; align-items: stretch;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px; margin-bottom: 12px; overflow: hidden;
    }
    .sb-cell { flex: 1; text-align: center; padding: 14px 12px; }
    .sb-divider { width: 1px; background: rgba(255,255,255,0.08); }
    .sb-label {
      font-size: 10px; font-weight: 700; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--text-dim); margin-bottom: 6px;
    }
    .sb-value { font-size: 20px; font-weight: 700; font-family: 'JetBrains Mono', monospace; }
    .sb-value.sb-blue { color: #3D7FFF; }
    .sb-value.sb-gray { color: #666; }
    .sb-ach { font-size: 11px; color: var(--text-dim); margin-top: 3px; }
    .sb-channel { font-size: 10px; color: var(--text-sub); margin-top: 4px; font-family: 'JetBrains Mono', monospace; }

    /* ── 섹션4 교차구매 ── */
    .s4-summary { font-size: 12px; color: var(--text-dim); }
    .s4-tables { display: flex; gap: 16px; overflow: hidden; }
    .s4-col { flex: 1; min-width: 0; }
    .s4-col-title {
      font-size: 10px; font-weight: 700; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--text-dim);
      margin-bottom: 8px;
    }
    .cross-table { width: 100%; min-width: 0; border-collapse: collapse; font-size: 13px; }
    .cross-table td:first-child { word-break: keep-all; }
    #s5-prod-tables .cross-table td:first-child { word-break: break-word; overflow-wrap: break-word; }
    .cross-table th {
      text-align: left; padding: 6px 8px;
      font-size: 10px; font-weight: 700; letter-spacing: 0.08em;
      color: var(--text-dim); border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .cross-table td { padding: 7px 8px; border-bottom: 1px solid rgba(255,255,255,0.04); }
    .cross-table td:nth-child(2), .cross-table td:nth-child(3) { text-align: right; }
    .cross-table td:nth-child(3) { color: var(--text-dim); font-size: 12px; }
    .cross-table tbody tr:hover td { background: var(--hover); }

    /* ── State ── */
    .state {
      display: flex; align-items: center; justify-content: center;
      min-height: 280px; gap: 10px;
      color: var(--text-sub); font-size: 13px;
    }
    .spinner {
      width: 15px; height: 15px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.65s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Table hint ── */
    .table-hint {
      font-size: 11px;
      color: var(--text-dim);
      margin-bottom: 8px;
      letter-spacing: 0.02em;
    }

    /* ── Mobile ── */
    /* ── Section 6 monthly table ── */
    .s6-group-th {
      text-align: center;
      border-right: 1px solid var(--border);
    }
    #s6-table-wrap table { min-width: unset; }

    /* ── Target comparison cell (V2 mode) ── */
    .tgt-old {
      display: block;
      font-size: 10px;
      color: var(--text-dim);
      line-height: 1.2;
      text-decoration: line-through;
    }
    .tgt-arrow {
      display: inline-block;
      font-size: 9px;
      color: var(--warning);
      margin: 0 3px;
      vertical-align: middle;
    }

    @media (max-width: 640px) {
      body { padding: 20px 14px 40px; }

      .brand-info h1 { font-size: 16px; white-space: nowrap; }
      .header-meta .timestamp { font-size: 10px; }
      .header { margin-bottom: 24px; padding-bottom: 16px; }

      html, body { font-size: 11px; }

      thead th { padding: 8px 10px; }
      .cat-row td, .prod-row td, .totals-row td { padding: 9px 10px; }
      .cat-prefix { font-size: 9px; }
      .cat-name { font-size: 11px; }
      .n { font-size: 11px; }
      thead th.col-name { min-width: 140px; }
      thead th.col-prog { min-width: 100px; }

      .s2-controls { flex-direction: column; align-items: flex-start; gap: 6px; }
      .s2-filters { flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; width: 100%; padding-bottom: 4px; }
      .filter-btn { white-space: nowrap; flex-shrink: 0; padding: 4px 10px; font-size: 9px; }
      .metric-btn { padding: 4px 10px; font-size: 9px; }

      .s4-tables { flex-direction: column; gap: 16px; }
      .s4-col-title { font-size: 9px; margin-bottom: 5px; }
      .s4-summary { font-size: 10px; }
      .cross-table { font-size: 10px; }
      .cross-table th { font-size: 8px; padding: 4px 5px; }
      .cross-table td { padding: 4px 5px; }
      .cross-table td:nth-child(3) { font-size: 9px; }
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-brand">
      <div class="brand-dot"></div>
      <div class="brand-info">
        <div class="location">마포 클럽하우스</div>
        <h1>프리세일 판매 현황</h1>
      </div>
    </div>
    <div class="header-meta">
      <div class="label">마지막 업데이트</div>
      <div class="timestamp" id="updated-at">—</div>
    </div>
  </div>

  <div class="section-label"><span class="sl-num">01</span><span class="sl-title">상품별 판매 실적 vs 목표</span></div>
  <p class="table-hint">▶ 행을 클릭하면 개별 상품 현황을 자세히 볼 수 있어요</p>
  <div class="s2-metric" style="margin-bottom:10px">
    <button class="metric-btn active" id="tgt-v1-btn" onclick="setTargetView('v1')">목표(최초)</button>
    <button class="metric-btn"        id="tgt-v2-btn" onclick="setTargetView('v2')">목표(변경1)</button>
  </div>

  <div class="table-wrap" id="table-wrap">
    <div class="state"><div class="spinner"></div><span>데이터 불러오는 중...</span></div>
  </div>

  <div class="section-label" style="margin-top: 40px"><span class="sl-num">02</span><span class="sl-title">결제 추이 & 마감 예상</span></div>
  <div class="s2-controls">
    <div class="s2-filters" id="s3-filters"></div>
    <div class="s2-metric">
      <button class="metric-btn active" id="s3-m-count"   onclick="setS3Metric('count')">건수</button>
      <button class="metric-btn"        id="s3-m-revenue" onclick="setS3Metric('revenue')">매출</button>
    </div>
  </div>
  <div class="scoreboard" id="s3-stats"></div>
  <div class="chart-wrap" style="height:300px">
    <canvas id="s3-trend-chart"></canvas>
  </div>

  <div class="section-label" style="margin-top: 40px"><span class="sl-num">03</span><span class="sl-title">일별 판매 추이(정규권)</span></div>
  <div class="s2-controls">
    <div class="s2-filters" id="s2-filters"></div>
    <div class="s2-metric">
      <button class="metric-btn active" id="m-count"   onclick="setMetric('count')">건수</button>
      <button class="metric-btn"        id="m-revenue" onclick="setMetric('revenue')">매출</button>
    </div>
  </div>
  <div class="chart-wrap" id="s2-chart-wrap">

  <p class="table-hint">▶ 행을 클릭하면 개별 상품 현황을 자세히 볼 수 있어요 · 건수 / VAT 제외 금액 기준</p>

  <div class="table-wrap" id="s6-table-wrap">
    <div class="state"><div class="spinner"></div><span>데이터 불러오는 중...</span></div>
  </div>

  <script>
    const REFRESH_MS = 600000;

    // BG/TB/RP 타임라인 데이터
    const TIMELINE_DATA = [
      { brand: 'BG', color: '#1FD49A', phases: [
        {                        end: '2026-04-22', label: '0차' },
        { start: '2026-04-23',  end: '2026-05-06', label: '1차' },
        { start: '2026-05-07',  end: '2026-05-20', label: '2차' },
        { start: '2026-05-21',  end: '2026-06-19', label: '3차' },
        { start: '2026-06-20',  end: '2026-06-30', label: '4차' },
        { start: '2026-07-01',  end: '2026-07-20', label: '5차' },
        { start: '2026-07-21',                      label: '정규' },
      ]},
      { brand: 'TB', color: '#1ABFBA', phases: [
        {                        end: '2026-05-12', label: '0차' },
        { start: '2026-05-13',  end: '2026-05-25', label: '1차' },
        { start: '2026-05-26',  end: '2026-06-19', label: '2차' },
        { start: '2026-06-22',  end: '2026-07-20', label: '3차' },
        { start: '2026-07-21',                      label: '정규' },
      ]},
      { brand: 'RP', color: '#3D7FFF', phases: [
        { start: '2026-05-06',  end: '2026-05-12', label: '1차' },
        { start: '2026-05-13',  end: '2026-05-22', label: '2차' },
        { start: '2026-05-26',  end: '2026-06-19', label: '3차' },
        { start: '2026-06-20',  end: '2026-07-20', label: '4차' },
        { start: '2026-07-21',                      label: '정규' },
      ]},
    ];

    // 카테고리별 차트 색상 (TAXONOMY 순서 일치)
    const CAT_COLORS = {
      // 파랑 (RP)
      'Package - 런포트 패키지':      '#3D7FFF',
      'Access - 러닝스테이션 멤버십': '#7AABFF',
      // 녹색 (BG 패키지)
      'Package - 버핏그라운드 패키지':  '#1FD49A',
      // 연두색 (BG 멤버십)
      'Access - 버핏그라운드 멤버십': '#86EFAC',
      // 주황색 (PT)
      'Access+Contents - PT':        '#F97316',
      // 노란색 (PT체험권)
      'Contents - PT체험권':          '#FDE047',
      // 보라색 (TB 패키지)
      'Package - 팀버핏 패키지':      '#8B5CF6',
      // 연보라색 (TB)
      'Access+Contents - 팀버핏':    '#C084FC',
      // 회색 (기타)
      'Contents - 사우나only':        '#6B7280',
      'option':                      '#9CA3AF',
      // 진한 노란색 (체험/일일권)
      'Contents - 체험/일일권':       '#D97706',
    };

    var trendChart     = null;
    var s2Metric       = 'count';
    var s2Filter       = '전체';
    var lastDailyStats = null;
    var lastCategories = null;

    var currentTargetView = 'v1';
    var lastRenderData    = null;
    var s6ViewMode        = 'monthly';
    var lastMonthlyData   = null;

    const TARGETS_V1 = {
      'Package - 런포트 패키지':       { count: 600,  revenue: 471960000 },
      'Package - 버핏그라운드 패키지':  { count: 100,  revenue: 84210000  },
      'Access - 버핏그라운드 멤버십':  { count: 541,  revenue: 282022600 },
      'Access+Contents - PT':         { count: 109,  revenue: 178481440 },
      'Access+Contents - 팀버핏':     { count: 200,  revenue: 155491000 },
      'Contents - 사우나only':         { count: 100,  revenue: 40658000  },
      'Contents - PT체험권':           { count: 97,   revenue: 4859262   },
      'option':                        { count: null, revenue: 45123616  },
    };

    const TARGETS_V2 = {
      'Package - 런포트 패키지':       { count: 450,  revenue: 240301000 },
      'Package - 버핏그라운드 패키지':  { count: 50,   revenue: 32460665  },
      'Package - 팀버핏 패키지':       { count: 50,   revenue: 42123616  },
      'Access - 버핏그라운드 멤버십':  { count: 541,  revenue: 282022600 },
      'Access+Contents - PT':         { count: 109,  revenue: 178481440 },
      'Access+Contents - 팀버핏':     { count: 350,  revenue: 293326000 },
      'Contents - 사우나only':         { count: 50,   revenue: 15170000  },
      'Contents - PT체험권':           { count: 97,   revenue: 4859262   },
      'option':                        { count: null, revenue: 45123616  },
    };

    function setMetric(m) {
      s2Metric = m;
      document.getElementById('m-count').classList.toggle('active',   m === 'count');
      document.getElementById('m-revenue').classList.toggle('active', m === 'revenue');
      if (lastDailyStats) buildChart(lastDailyStats);
    }

    function setS2Filter(catName) {
      s2Filter = catName;
      document.querySelectorAll('.filter-btn').forEach(function(b) {
        var isActive = b.dataset.cat === catName;
        b.classList.toggle('active', isActive);
        if (b.dataset.cat !== '전체') {
          b.style.backgroundColor = isActive ? CAT_COLORS[b.dataset.cat] : '';
          b.style.color           = isActive ? '#fff' : CAT_COLORS[b.dataset.cat];
        }
      });
      if (lastDailyStats) buildChart(lastDailyStats);
    }

    function makeFilterBtn(catName, isActive) {
      var btn = document.createElement('button');
      btn.className    = 'filter-btn' + (isActive ? ' active' : '');
      btn.dataset.cat  = catName;
      btn.textContent  = catName === '전체' ? '전체' : catName === 'option' ? '옵션상품' : catName.split(' - ').slice(1).join(' - ');
      if (catName !== '전체') {
        btn.style.borderColor     = CAT_COLORS[catName];
        btn.style.color           = isActive ? '#fff' : CAT_COLORS[catName];
        btn.style.backgroundColor = isActive ? CAT_COLORS[catName] : '';
      }
      btn.onclick = function() { setS2Filter(catName); };
      return btn;
    }

    function genShades(hex, count) {
      if (count <= 1) return [hex];
      var r = parseInt(hex.slice(1,3), 16);
      var g = parseInt(hex.slice(3,5), 16);
      var b = parseInt(hex.slice(5,7), 16);
      var shades = [];
      for (var i = 0; i < count; i++) {
        var t = i / (count - 1) * 0.55;
        var nr = Math.round(r + (255 - r) * t);
        var ng = Math.round(g + (255 - g) * t);
        var nb = Math.round(b + (255 - b) * t);
        shades.push('rgb(' + nr + ',' + ng + ',' + nb + ')');
      }
      return shades;
    }

    function renderSection2(dailyStats) {
      if (!dailyStats || dailyStats.length === 0) return;
      lastDailyStats = dailyStats;

      var container = document.getElementById('s2-filters');
      if (!container.hasChildNodes()) {
        container.appendChild(makeFilterBtn('전체', true));
        Object.keys(CAT_COLORS).forEach(function(cat) {
          if (cat === 'Contents - 체험/일일권') return;
          container.appendChild(makeFilterBtn(cat, false));
        });
      }
      buildChart(dailyStats);
    }

    function buildChart(dailyStats) {
      // 첫 결제일 ~ 오늘까지 전체 날짜 범위 생성 (빈 날짜 포함)
      var firstDate = new Date(dailyStats[0].date);
      var lastDate  = new Date(PRESALE_END);
      var allDates = [];
      var cur = new Date(firstDate);
      while (cur <= lastDate) {
        allDates.push(cur.toISOString().substring(0, 10));
        cur.setDate(cur.getDate() + 1);
      }
      var dataByDate = {};
      dailyStats.forEach(function(d) { dataByDate[d.date] = d; });

      var labels  = allDates.map(function(d) { return d.substring(5); });
      var metric  = s2Metric;
      var isStack = s2Filter === '전체';
      var datasets;

      // 가로 스크롤: 모바일에서 바 1개당 36px, 데스크탑 28px
      var wrap = document.getElementById('s2-chart-wrap');
      var isMobile = window.innerWidth <= 640;
      var barW = isMobile ? 36 : 28;
      var minWidth = Math.max(wrap.clientWidth - 40, allDates.length * barW);
      var scrollInner = document.getElementById('s2-scroll-inner');
      var canvas = document.getElementById('trend-chart');
      scrollInner.style.width = minWidth + 'px';
      // height는 CSS #s2-chart-inner { height: 240px } 로 처리

      if (isStack) {
        datasets = Object.keys(CAT_COLORS).filter(function(cat) {
          return cat !== 'Contents - 체험/일일권';
        }).map(function(cat) {
          return {
            label: cat.split(' - ').slice(1).join(' - '),
            data: allDates.map(function(d) {
              var entry = dataByDate[d];
              return (entry && entry.byCategory[cat] && entry.byCategory[cat][metric]) || 0;
            }),
            backgroundColor: CAT_COLORS[cat],
            borderRadius: 2, borderSkipped: false,
          };
        });
      } else {
        // 하위상품 드릴다운: products가 있으면 상품별 스택, 없으면 단색 바
        var catInfo = lastCategories && lastCategories.find(function(c) { return c.category === s2Filter; });
        var prodList = (catInfo && catInfo.products && catInfo.products.length > 0) ? catInfo.products : null;
        if (prodList && !PENDING_CATEGORIES.has(s2Filter) && !UPCOMING_CATEGORIES.has(s2Filter)) {
          var shades = genShades(CAT_COLORS[s2Filter] || '#888', prodList.length);
          datasets = prodList.map(function(prod, i) {
            return {
              label: prod.name,
              data: allDates.map(function(d) {
                var entry = dataByDate[d];
                var byProd = entry && entry.byCategory[s2Filter] && entry.byCategory[s2Filter].products;
                return (byProd && byProd[prod.name] && byProd[prod.name][metric]) || 0;
              }),
              backgroundColor: shades[i],
              borderRadius: 2, borderSkipped: false,
            };
          });
          isStack = true; // 범례 표시용
        } else {
          datasets = [{
            label: s2Filter.split(' - ').slice(1).join(' - '),
            data: allDates.map(function(d) {
              var entry = dataByDate[d];
              return (entry && entry.byCategory[s2Filter] && entry.byCategory[s2Filter][metric]) || 0;
            }),
            backgroundColor: CAT_COLORS[s2Filter],
            borderRadius: 3, borderSkipped: false,
          }];
        }
      }

      // 툴팁용 채널(온/오프라인) 조회 맵: { [dateIdx]: { [label]: { online, offline } } }
      var channelByDateLabel = {};
      allDates.forEach(function(d, i) {
        channelByDateLabel[i] = {};
        var entry = dataByDate[d];
        if (!entry || !entry.byCategory) return;
        if (s2Filter === '전체') {
          Object.keys(entry.byCategory).forEach(function(cat) {
            var shortLabel = cat.split(' - ').slice(1).join(' - ');
            var bc = entry.byCategory[cat];
            channelByDateLabel[i][shortLabel] = { online: bc.onlineCount || 0, offline: bc.offlineCount || 0 };
          });
        } else {
          var bc = entry.byCategory[s2Filter];
          if (bc) {
            if (bc.products) {
              Object.keys(bc.products).forEach(function(prod) {
                channelByDateLabel[i][prod] = { online: bc.products[prod].onlineCount || 0, offline: bc.products[prod].offlineCount || 0 };
              });
            }
            var shortLabel = s2Filter.split(' - ').slice(1).join(' - ');
            channelByDateLabel[i][shortLabel] = { online: bc.onlineCount || 0, offline: bc.offlineCount || 0 };
          }
        }
      });

      var gridColor = 'rgba(255,255,255,0.04)';
      var tickColor = '#3A4F6A';
      var mono      = "'JetBrains Mono', monospace";

      // 오늘 날짜 (KST +9h 보정)
      var nowS2 = new Date(); nowS2.setHours(nowS2.getHours() + 9);
      var todayS2 = nowS2.toISOString().substring(0, 10);

      var todayLinePluginS2 = {
        id: 'todayLineS2',
        afterDraw: function(chart) {
          var idx = allDates.indexOf(todayS2);
          if (idx < 0) return;
          var xScale = chart.scales.x;
          var yScale = chart.scales.y;
          var ctx2   = chart.ctx;
          var x = xScale.getPixelForValue(idx);
          ctx2.save();
          ctx2.strokeStyle = 'rgba(255,90,80,0.65)';
          ctx2.setLineDash([4, 4]);
          ctx2.lineWidth = 1;
          ctx2.beginPath();
          ctx2.moveTo(x, yScale.top);
          ctx2.lineTo(x, yScale.bottom);
          ctx2.stroke();
          ctx2.setLineDash([]);
          ctx2.fillStyle = 'rgba(255,110,100,0.9)';
          ctx2.font = '10px "Noto Sans KR"';
          ctx2.textAlign = 'left';
          ctx2.fillText('오늘', x + 4, yScale.top + 14);
          ctx2.restore();
        }
      };

      // 합계 레이블 플러그인
      var stackTotalsPlugin = {
        id: 'stackTotals',
        afterDatasetsDraw: function(chart) {
          var ctx2 = chart.ctx;
          var dsCount = chart.data.datasets.length;
          if (dsCount === 0) return;
          chart.data.labels.forEach(function(_, i) {
            var total = chart.data.datasets.reduce(function(sum, ds) {
              return sum + (ds.data[i] || 0);
            }, 0);
            if (!total) return;
            var lastMeta = chart.getDatasetMeta(dsCount - 1);
            if (!lastMeta.data[i]) return;
            var x = lastMeta.data[i].x;
            var y = lastMeta.data[i].y - 4;
            ctx2.save();
            ctx2.font = "9px 'JetBrains Mono', monospace";
            ctx2.fillStyle = '#8A9DC0';
            ctx2.textAlign = 'center';
            ctx2.textBaseline = 'bottom';
            var lbl = metric === 'revenue'
              ? Math.round(total / 10000) + '만'
              : String(total);
            ctx2.fillText(lbl, x, y);
            ctx2.restore();
          });
        }
      };

      var opts = {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: {
            display: isStack, position: 'top',
            labels: { color: tickColor, font: { size: 10 }, boxWidth: 10, padding: 12 }
          },
          tooltip: {
            mode: 'index',
            callbacks: {
              label: function(ctx) {
                var v = ctx.parsed.y;
                var label = ' ' + ctx.dataset.label + ': ';
                if (metric === 'revenue') return label + v.toLocaleString('ko-KR') + '원';
                var ch = channelByDateLabel[ctx.dataIndex] && channelByDateLabel[ctx.dataIndex][ctx.dataset.label];
                var chStr = (ch && (ch.online + ch.offline) > 0)
                  ? ' (온라인 ' + ch.online + ' / 오프라인 ' + ch.offline + ')'
                  : '';
                return label + v + '건' + chStr;
              }
            }
          }
        },
        scales: {
          x: {
            stacked: isStack,
            grid: { color: gridColor },
            ticks: { color: tickColor, font: { family: mono, size: 10 }, maxRotation: 45 }
          },
          y: {
            stacked: isStack,
            grid: { color: gridColor },
            ticks: {
              color: tickColor, font: { family: mono, size: 10 },
              callback: metric === 'revenue'
                ? function(v) { return (v / 10000).toFixed(0) + '만'; }
                : undefined
            }
          }
        }
      };

      if (trendChart) trendChart.destroy();
      trendChart = new Chart(document.getElementById('trend-chart'), {
        type: 'bar', data: { labels: labels, datasets: datasets },
        options: opts, plugins: [stackTotalsPlugin, todayLinePluginS2]
      });
      buildTimeline(allDates);
      // 오늘 날짜가 viewport 중앙에 오도록 자동 스크롤
      var todayIdxScroll = allDates.indexOf(todayS2);
      if (todayIdxScroll >= 0) {
        var todayXPos = trendChart.scales.x.getPixelForValue(todayIdxScroll);
        wrap.scrollLeft = Math.max(0, todayXPos - wrap.clientWidth / 2);
      } else {
        wrap.scrollLeft = wrap.scrollWidth;
      }
    }

    function buildTimeline(allDates) {
      var container = document.getElementById('s2-timeline');
      container.innerHTML = '';
      if (!TIMELINE_DATA.length || allDates.length < 2) return;

      var xScale    = trendChart.scales.x;
      var n         = allDates.length;
      var barHalf   = (xScale.getPixelForValue(1) - xScale.getPixelForValue(0)) / 2;
      var plotLeft  = xScale.getPixelForValue(0)     - barHalf;
      var plotRight = xScale.getPixelForValue(n - 1) + barHalf;
      var yAxisW    = plotLeft;

      var chartFirst = allDates[0];
      var chartLast  = allDates[n - 1];

      function startX(dateStr) {
        if (!dateStr || dateStr <= chartFirst) return plotLeft;
        if (dateStr > chartLast) return plotRight;
        var idx = allDates.indexOf(dateStr);
        return idx >= 0 ? xScale.getPixelForValue(idx) - barHalf : plotLeft;
      }

      function endX(dateStr) {
        if (!dateStr || dateStr >= chartLast) return plotRight;
        if (dateStr < chartFirst) return plotLeft;
        var idx = allDates.indexOf(dateStr);
        return idx >= 0 ? xScale.getPixelForValue(idx) + barHalf : plotRight;
      }

      TIMELINE_DATA.forEach(function(tl) {
        var row = document.createElement('div');
        row.className = 'tl-row';

        var lbl = document.createElement('div');
        lbl.className    = 'tl-brand-label';
        lbl.textContent  = tl.brand;
        lbl.style.color  = tl.color;
        lbl.style.width  = yAxisW + 'px';
        row.appendChild(lbl);

        var rc = parseInt(tl.color.slice(1,3), 16);
        var gc = parseInt(tl.color.slice(3,5), 16);
        var bc = parseInt(tl.color.slice(5,7), 16);

        tl.phases.forEach(function(phase) {
          var phEnd   = phase.end   || chartLast;
          var phStart = phase.start || '';
          if (phEnd < chartFirst) return;
          if (phStart && phStart > chartLast) return;

          var lx = phStart ? startX(phStart) : plotLeft;
          var rx = endX(phEnd);
          var w  = rx - lx;
          if (w < 4) return;

          var seg = document.createElement('div');
          seg.className             = 'tl-segment';
          seg.style.left            = lx + 'px';
          seg.style.width           = w  + 'px';
          seg.style.backgroundColor = 'rgba(' + rc + ',' + gc + ',' + bc + ',0.15)';
          seg.style.borderColor     = 'rgba(' + rc + ',' + gc + ',' + bc + ',0.45)';
          seg.style.color           = tl.color;
          seg.textContent           = phase.label;
          row.appendChild(seg);
        });

        container.appendChild(row);
      });
    }

    // ── 섹션 4: 일별 판매 추이(체험/일일권) ──────────────────────
    const TRIAL_CATEGORY = 'Contents - 체험/일일권';
    const TRIAL_PRODUCTS_LIST = ['런포트 체험권', '클럽하우스 1일권', '버핏그라운드 1일권', '사우나 1회권 Only'];
    const TRIAL_PROD_COLORS = {
      '런포트 체험권':    '#F2A93B',
      '클럽하우스 1일권':  '#F7C46A',
      '버핏그라운드 1일권': '#FBD99A',
      '사우나 1회권 Only': '#94A3B8',
    };

    var trialChart          = null;
    var trialMetric         = 'count';
    var lastTrialDailyStats = null;

    function setTrialMetric(m) {
      trialMetric = m;
      document.getElementById('trial-m-count').classList.toggle('active',   m === 'count');
      document.getElementById('trial-m-revenue').classList.toggle('active', m === 'revenue');
      if (lastTrialDailyStats) buildTrialChart(lastTrialDailyStats);
    }

    function renderTrialSection(dailyStats) {
      if (!dailyStats || dailyStats.length === 0) return;
      lastTrialDailyStats = dailyStats;
      buildTrialChart(dailyStats);
    }

    function buildTrialChart(dailyStats) {
      var firstDate = new Date(dailyStats[0].date);
      var lastDate  = new Date(PRESALE_END);
      var allDates  = [];
      var cur = new Date(firstDate);
      while (cur <= lastDate) {
        allDates.push(cur.toISOString().substring(0, 10));
        cur.setDate(cur.getDate() + 1);
      }
      var dataByDate = {};
      dailyStats.forEach(function(d) { dataByDate[d.date] = d; });

      var labels   = allDates.map(function(d) { return d.substring(5); });
      var metric   = trialMetric;

      var wrap = document.getElementById('trial-chart-wrap');
      var isMobile = window.innerWidth <= 640;
      var barW = isMobile ? 36 : 28;
      var minWidth = Math.max(wrap.clientWidth - 40, allDates.length * barW);
      document.getElementById('trial-scroll-inner').style.width = minWidth + 'px';

      var datasets = TRIAL_PRODUCTS_LIST.map(function(prod) {
        return {
          label: prod,
          data: allDates.map(function(d) {
            var entry  = dataByDate[d];
            var byProd = entry && entry.byCategory[TRIAL_CATEGORY] && entry.byCategory[TRIAL_CATEGORY].products;
            return (byProd && byProd[prod] && byProd[prod][metric]) || 0;
          }),
          backgroundColor: TRIAL_PROD_COLORS[prod],
          borderRadius: 2, borderSkipped: false,
        };
      });

      var gridColor = 'rgba(255,255,255,0.04)';
      var tickColor = '#3A4F6A';
      var mono      = "'JetBrains Mono', monospace";

      var nowTrial   = new Date(); nowTrial.setHours(nowTrial.getHours() + 9);
      var todayTrial = nowTrial.toISOString().substring(0, 10);

      var todayLinePluginTrial = {
        id: 'todayLineTrial',
        afterDraw: function(chart) {
          var idx = allDates.indexOf(todayTrial);
          if (idx < 0) return;
          var xScale = chart.scales.x;
          var yScale = chart.scales.y;
          var ctx2   = chart.ctx;
          var x = xScale.getPixelForValue(idx);
          ctx2.save();
          ctx2.strokeStyle = 'rgba(255,90,80,0.65)';
          ctx2.setLineDash([4, 4]);
          ctx2.lineWidth = 1;
          ctx2.beginPath();
          ctx2.moveTo(x, yScale.top);
          ctx2.lineTo(x, yScale.bottom);
          ctx2.stroke();
          ctx2.setLineDash([]);
          ctx2.fillStyle = 'rgba(255,110,100,0.9)';
          ctx2.font = '10px "Noto Sans KR"';
          ctx2.textAlign = 'left';
          ctx2.fillText('오늘', x + 4, yScale.top + 14);
          ctx2.restore();
        }
      };

      var stackTotalsPluginTrial = {
        id: 'stackTotalsTrial',
        afterDatasetsDraw: function(chart) {
          var ctx2    = chart.ctx;
          var dsCount = chart.data.datasets.length;
          if (dsCount === 0) return;
          chart.data.labels.forEach(function(_, i) {
            var total = chart.data.datasets.reduce(function(sum, ds) {
              return sum + (ds.data[i] || 0);
            }, 0);
            if (!total) return;
            var lastMeta = chart.getDatasetMeta(dsCount - 1);
            if (!lastMeta.data[i]) return;
            var x = lastMeta.data[i].x;
            var y = lastMeta.data[i].y - 4;
            ctx2.save();
            ctx2.font = "9px 'JetBrains Mono', monospace";
            ctx2.fillStyle = '#8A9DC0';
            ctx2.textAlign = 'center';
            ctx2.textBaseline = 'bottom';
            ctx2.fillText(metric === 'revenue' ? Math.round(total / 10000) + '만' : String(total), x, y);
            ctx2.restore();
          });
        }
      };

      if (trialChart) trialChart.destroy();
      trialChart = new Chart(document.getElementById('trial-chart'), {
        type: 'bar',
        data: { labels: labels, datasets: datasets },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: {
            legend: {
              display: true, position: 'top',
              labels: { color: tickColor, font: { size: 10 }, boxWidth: 10, padding: 12 }
            },
            tooltip: {
              mode: 'index',
              callbacks: {
                label: function(ctx) {
                  var v = ctx.parsed.y;
                  if (metric === 'revenue') return ' ' + ctx.dataset.label + ': ' + v.toLocaleString('ko-KR') + '원';
                  return ' ' + ctx.dataset.label + ': ' + v + '건';
                }
              }
            }
          },
          scales: {
            x: {
              stacked: true,
              grid: { color: gridColor },
              ticks: { color: tickColor, font: { family: mono, size: 10 }, maxRotation: 45 }
            },
            y: {
              stacked: true,
              grid: { color: gridColor },
              ticks: {
                color: tickColor, font: { family: mono, size: 10 },
                callback: metric === 'revenue'
                  ? function(v) { return (v / 10000).toFixed(0) + '만'; }
                  : undefined
              }
            }
          }
        },
        plugins: [stackTotalsPluginTrial, todayLinePluginTrial]
      });

      // 오늘 날짜가 viewport 중앙에 오도록 자동 스크롤
      var todayIdxScroll = allDates.indexOf(todayTrial);
      if (todayIdxScroll >= 0) {
        var todayXPos = trialChart.scales.x.getPixelForValue(todayIdxScroll);
        wrap.scrollLeft = Math.max(0, todayXPos - wrap.clientWidth / 2);
      } else {
        wrap.scrollLeft = wrap.scrollWidth;
      }
    }
    // ────────────────────────────────────────────────────────────

    // ── 섹션 3: 누적 실적 vs 목표 vs 마감 예상 ──────────────────
    const PRESALE_END = '2026-07-31';

    var s3Chart        = null;
    var s3Metric       = 'count';
    var s3DailyStats   = null;
    var s3TgtRevenue   = 0;
    var s3TgtCount     = 0;
    var s3Filter       = '전체';
    var s3Categories   = [];

    function setS3Filter(catName) {
      s3Filter = catName;
      document.querySelectorAll('#s3-filters .filter-btn').forEach(function(b) {
        var isActive = b.dataset.cat === catName;
        b.classList.toggle('active', isActive);
        if (b.dataset.cat !== '전체') {
          b.style.backgroundColor = isActive ? CAT_COLORS[b.dataset.cat] : '';
          b.style.color           = isActive ? '#fff' : CAT_COLORS[b.dataset.cat];
        }
      });
      if (s3DailyStats) buildTrendChart();
    }

    function makeS3FilterBtn(catName, isActive) {
      var btn = document.createElement('button');
      btn.className   = 'filter-btn' + (isActive ? ' active' : '');
      btn.dataset.cat = catName;
      btn.textContent = catName === '전체' ? '전체' : catName === 'option' ? '옵션상품' : catName.split(' - ').slice(1).join(' - ');
      if (catName !== '전체') {
        btn.style.borderColor     = CAT_COLORS[catName];
        btn.style.color           = isActive ? '#fff' : CAT_COLORS[catName];
        btn.style.backgroundColor = isActive ? CAT_COLORS[catName] : '';
      }
      btn.onclick = function() { setS3Filter(catName); };
      return btn;
    }

    function setS3Metric(m) {
      s3Metric = m;
      document.getElementById('s3-m-revenue').classList.toggle('active', m === 'revenue');
      document.getElementById('s3-m-count').classList.toggle('active',   m === 'count');
      if (s3DailyStats) buildTrendChart();
    }

    function renderSection3(dailyStats, categories, tgtRevenue, tgtCount) {
      if (!dailyStats || !dailyStats.length) return;
      s3DailyStats  = dailyStats;
      s3Categories  = categories;
      s3TgtRevenue  = tgtRevenue;
      s3TgtCount    = tgtCount;

      var container = document.getElementById('s3-filters');
      if (!container.hasChildNodes()) {
        container.appendChild(makeS3FilterBtn('전체', true));
        Object.keys(CAT_COLORS).forEach(function(cat) {
          container.appendChild(makeS3FilterBtn(cat, false));
        });
      }
      buildTrendChart();
    }

    function buildTrendChart() {
      var metric = s3Metric;
      var totalGoal;
      if (s3Filter === '전체') {
        totalGoal = metric === 'revenue' ? s3TgtRevenue : s3TgtCount;
      } else {
        var tgtV2 = TARGETS_V2[s3Filter] || null;
        totalGoal = tgtV2
          ? (metric === 'revenue' ? tgtV2.revenue : tgtV2.count) || 0
          : 0;
      }

      // 날짜 범위: 첫 데이터 날짜 ~ PRESALE_END
      var allDates = [];
      var d = new Date(s3DailyStats[0].date);
      var endD = new Date(PRESALE_END);
      while (d <= endD) {
        allDates.push(d.toISOString().substring(0, 10));
        d.setDate(d.getDate() + 1);
      }

      // 일별 totals 맵 (필터 적용)
      var dailyMap = {};
      s3DailyStats.forEach(function(item) {
        var total = 0;
        if (s3Filter === '전체') {
          Object.keys(item.byCategory).forEach(function(cat) {
            if (metric === 'count' && EXCLUDE_FROM_TOTAL.has(cat)) return;
            total += (item.byCategory[cat][metric] || 0);
          });
        } else {
          total = (item.byCategory[s3Filter] && item.byCategory[s3Filter][metric]) || 0;
        }
        dailyMap[item.date] = total;
      });

      // 오늘 (UTC 기준, KST +9h 보정)
      var now = new Date();
      now.setHours(now.getHours() + 9);
      var today = now.toISOString().substring(0, 10);

      // 누적 실적 (오늘까지)
      var cumActual  = [];
      var runSum     = 0;
      var currentVal = 0;
      allDates.forEach(function(dt) {
        if (dt <= today) {
          runSum += (dailyMap[dt] || 0);
          cumActual.push(runSum);
          currentVal = runSum;
        } else {
          cumActual.push(null);
        }
      });

      // 목표선 (선형)
      var totalDays = allDates.length - 1;
      var goalLine  = allDates.map(function(dt, i) {
        return Math.round((i / totalDays) * totalGoal);
      });

      // 마감 예상 (오늘 이후 선형 외삽)
      var todayIdx     = allDates.indexOf(today);
      var dailyRate    = todayIdx > 0 ? currentVal / (todayIdx + 1) : 0;
      var forecastLine = allDates.map(function(dt, i) {
        if (i < todayIdx) return null;
        return Math.round(currentVal + dailyRate * (i - todayIdx));
      });
      var forecastEnd = forecastLine[forecastLine.length - 1] || 0;

      // 달성률 + 스코어보드
      var hasGoal = totalGoal > 0;
      var achPct  = hasGoal ? (currentVal / totalGoal * 100).toFixed(1) : null;

      var fmt = metric === 'revenue'
        ? function(v) { return (v / 100000000).toFixed(2) + '억'; }
        : function(v) { return v.toLocaleString('ko-KR') + '명'; };

      // 온/오프라인 집계 (건수 모드만)
      var currentOnline = 0, currentOffline = 0;
      if (metric === 'count' && s3Categories) {
        s3Categories.forEach(function(c) {
          if (s3Filter === '전체' || c.category === s3Filter) {
            currentOnline  += (c.onlineCount  || 0);
            currentOffline += (c.offlineCount || 0);
          }
        });
      }
      var channelLine = (metric === 'count' && (currentOnline + currentOffline) > 0)
        ? '<div class="sb-channel">온라인 ' + currentOnline + ' / 오프라인 ' + currentOffline + '</div>'
        : '';

      var goalCell = hasGoal
        ? '<div class="sb-value">' + fmt(totalGoal) + '</div>'
        : '<div class="sb-value sb-gray">—</div>';
      document.getElementById('s3-stats').innerHTML =
        '<div class="sb-cell">'
          + '<div class="sb-label">최종 목표</div>' + goalCell
        + '</div>'
        + '<div class="sb-divider"></div>'
        + '<div class="sb-cell">'
          + '<div class="sb-label">현재</div>'
          + '<div class="sb-value sb-blue">' + fmt(currentVal) + '</div>'
          + channelLine
          + (achPct ? '<div class="sb-ach">' + achPct + '% 달성</div>' : '')
        + '</div>'
        + '<div class="sb-divider"></div>'
        + '<div class="sb-cell">'
          + '<div class="sb-label">마감 예상</div>'
          + '<div class="sb-value sb-gray">' + fmt(forecastEnd) + '</div>'
        + '</div>';

      var labels    = allDates.map(function(dt) { return dt.substring(5); });
      var gridColor = 'rgba(255,255,255,0.04)';
      var tickColor = '#3A4F6A';
      var mono      = "'JetBrains Mono', monospace";
      var yFmt      = metric === 'revenue'
        ? function(v) { return (v / 100000000).toFixed(1) + '억'; }
        : function(v) { return v.toLocaleString('ko-KR'); };

      var todayLinePlugin = {
        id: 'todayLine',
        afterDraw: function(chart) {
          var idx = allDates.indexOf(today);
          if (idx < 0) return;
          var xScale = chart.scales.x;
          var yScale = chart.scales.y;
          var ctx    = chart.ctx;
          var x = xScale.getPixelForValue(idx);
          ctx.save();
          ctx.strokeStyle = 'rgba(255,90,80,0.65)';
          ctx.setLineDash([4, 4]);
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(x, yScale.top);
          ctx.lineTo(x, yScale.bottom);
          ctx.stroke();
          ctx.setLineDash([]);
          ctx.fillStyle = 'rgba(255,110,100,0.9)';
          ctx.font = '10px "Noto Sans KR"';
          ctx.fillText('오늘', x + 4, yScale.top + 14);
          ctx.restore();
        }
      };

      var s3Datasets = [];
      if (hasGoal) {
        s3Datasets.push({
          label: '목표',
          data: goalLine,
          borderColor: 'rgba(150,150,150,0.6)',
          borderDash: [6, 4], borderWidth: 1.5,
          pointRadius: 0, fill: false, tension: 0,
        });
      }
      s3Datasets.push({
        label: '누적 실적',
        data: cumActual,
        borderColor: '#3D7FFF', borderWidth: 2,
        pointRadius: 0, fill: false, tension: 0.3,
        spanGaps: false,
      });
      s3Datasets.push({
        label: '마감 예상',
        data: forecastLine,
        borderColor: '#F5A623',
        borderDash: [6, 4], borderWidth: 1.5,
        pointRadius: 0, fill: false, tension: 0,
        spanGaps: false,
      });

      if (s3Chart) s3Chart.destroy();
      s3Chart = new Chart(document.getElementById('s3-trend-chart'), {
        type: 'line',
        plugins: [todayLinePlugin],
        data: { labels: labels, datasets: s3Datasets },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: {
            legend: {
              display: true, position: 'bottom',
              labels: {
                color: tickColor, font: { size: 10 }, boxWidth: 20, padding: 16,
                generateLabels: function() {
                  var items = [];
                  if (hasGoal) items.push({ text: '목표', strokeStyle: 'rgba(150,150,150,0.6)', lineDash: [6,4], lineWidth: 1.5, fillStyle: 'transparent', fontColor: tickColor });
                  items.push({ text: '누적 실적', strokeStyle: '#3D7FFF', lineWidth: 2, fillStyle: 'transparent', fontColor: tickColor });
                  items.push({ text: '마감 예상', strokeStyle: '#F5A623', lineDash: [6,4], lineWidth: 1.5, fillStyle: 'transparent', fontColor: tickColor });
                  return items;
                }
              }
            },
            tooltip: {
              mode: 'index', intersect: false,
              callbacks: {
                label: function(ctx) {
                  if (ctx.parsed.y === null) return null;
                  return ' ' + ctx.dataset.label + ': ' + fmt(ctx.parsed.y);
                }
              }
            }
          },
          scales: {
            x: {
              grid: { color: gridColor },
              ticks: {
                color: tickColor, font: { family: mono, size: 10 }, maxRotation: 0,
                callback: function(val, idx) {
                  return idx % 7 === 0 ? this.getLabelForValue(val) : null;
                }
              }
            },
            y: {
              grid: { color: gridColor },
              ticks: { color: tickColor, font: { family: mono, size: 10 }, callback: yFmt }
            }
          }
        }
      });
    }
    // ────────────────────────────────────────────────────────────

    // 실적 집계 전 카테고리 — 실적 컬럼에 (미집계중) 표기
    const PENDING_CATEGORIES = new Set([
      'option',
    ]);

    // 판매 예정 카테고리 — 실적 컬럼에 (예정) 표기
    const UPCOMING_CATEGORIES = new Set([]);

    // 전체 건수 합산 제외 카테고리 (금액은 전체 포함)
    const EXCLUDE_FROM_TOTAL = new Set([
      'Contents - 사우나only',
      'Contents - PT체험권',
      'option',
      'Contents - 체험/일일권',
    ]);

    const BAND_MAP = {
      'Package - 런포트 패키지':      'band-rp-pkg',
      'Access - 러닝스테이션 멤버십': 'band-rp-pkg',
      'Package - 버핏그라운드 패키지':  'band-bg-pkg',
      'Access - 버핏그라운드 멤버십': 'band-bg-mem',
      'Access+Contents - PT':        'band-pt',
      'Contents - PT체험권':          'band-pt-trial',
      'Package - 팀버핏 패키지':      'band-tb-pkg',
      'Access+Contents - 팀버핏':    'band-tb',
      'Contents - 사우나only':        'band-gray',
      'option':                      'band-gray',
      'Contents - 체험/일일권':       'band-trial',
    };
    function getBand(cat) { return BAND_MAP[cat] || ''; }

    function fmtN(n) {
      return (n !== null && n !== undefined) ? n.toLocaleString('ko-KR') : null;
    }

    function dash() {
      return '<span style="color:var(--text-dim);font-family:\'JetBrains Mono\',monospace">—</span>';
    }

    function pending() {
      return '<span class="pending-cell">(미집계중)</span>';
    }

    function upcoming() {
      return '<span class="pending-cell">(예정)</span>';
    }

    function colorClass(pct) {
      if (pct >= 100) return 'done';
      if (pct >= 70)  return 'high';
      if (pct >= 30)  return 'mid';
      if (pct >= 10)  return 'early';
      return 'none';
    }

    function progressCell(actual, target) {
      if (!target) return dash();
      const pct    = (actual / target) * 100;
      const cls    = colorClass(pct);
      const fillW  = Math.min(pct, 100).toFixed(1);
      return '<div class="ach">'
        + '<span class="pct c-' + cls + '">' + pct.toFixed(1) + '%</span>'
        + '<div class="bar-track"><div class="bar-fill c-' + cls + '" style="width:' + fillW + '%"></div></div>'
        + '</div>';
    }

    // PT+BG와 Contents-PT를 단일 'Access+Contents - PT' 카테고리로 병합
    var PT_CAT_1  = 'Access+Contents - PT+BG';
    var PT_CAT_2  = 'Contents - PT';
    var PT_MERGED = 'Access+Contents - PT';

    function mergePTCategories(data) {
      var newCats = [];
      var mergedCat = null;
      data.categories.forEach(function(cat) {
        if (cat.category === PT_CAT_1) {
          mergedCat = {
            category:      PT_MERGED,
            count:         cat.count,
            revenue:       cat.revenue,
            onlineCount:   cat.onlineCount  || 0,
            offlineCount:  cat.offlineCount || 0,
            products:      (cat.products || []).slice(),
            targetCount:   cat.targetCount,
            targetRevenue: cat.targetRevenue,
          };
          newCats.push(mergedCat);
        } else if (cat.category === PT_CAT_2) {
          if (mergedCat) {
            mergedCat.count        += cat.count;
            mergedCat.revenue      += cat.revenue;
            mergedCat.onlineCount  += (cat.onlineCount  || 0);
            mergedCat.offlineCount += (cat.offlineCount || 0);
            (cat.products || []).forEach(function(p) { mergedCat.products.push(p); });
          }
        } else {
          newCats.push(cat);
        }
      });
      data.categories = newCats;

      if (data.dailyStats) {
        data.dailyStats.forEach(function(day) {
          if (!day.byCategory) return;
          var c1 = day.byCategory[PT_CAT_1];
          var c2 = day.byCategory[PT_CAT_2];
          if (!c1 && !c2) return;
          var merged = {
            count:        ((c1 && c1.count)        || 0) + ((c2 && c2.count)        || 0),
            revenue:      ((c1 && c1.revenue)      || 0) + ((c2 && c2.revenue)      || 0),
            onlineCount:  ((c1 && c1.onlineCount)  || 0) + ((c2 && c2.onlineCount)  || 0),
            offlineCount: ((c1 && c1.offlineCount) || 0) + ((c2 && c2.offlineCount) || 0),
            products: {},
          };
          if (c1 && c1.products) Object.assign(merged.products, c1.products);
          if (c2 && c2.products) Object.assign(merged.products, c2.products);
          day.byCategory[PT_MERGED] = merged;
          delete day.byCategory[PT_CAT_1];
          delete day.byCategory[PT_CAT_2];
        });
      }
      return data;
    }

    function mergePTMonthly(d) {
      if (!d || !d.categories) return d;
      var newCats = [];
      var mergedCat = null;
      d.categories.forEach(function(cat) {
        if (cat.category === PT_CAT_1) {
          mergedCat = {
            category: PT_MERGED,
            total:    { count: cat.total.count, revenue: cat.total.revenue },
            byMonth:  {},
            products: (cat.products || []).slice(),
          };
          Object.keys(cat.byMonth || {}).forEach(function(m) {
            mergedCat.byMonth[m] = { count: cat.byMonth[m].count, revenue: cat.byMonth[m].revenue };
          });
          newCats.push(mergedCat);
        } else if (cat.category === PT_CAT_2) {
          if (mergedCat) {
            mergedCat.total.count   += cat.total.count;
            mergedCat.total.revenue += cat.total.revenue;
            Object.keys(cat.byMonth || {}).forEach(function(m) {
              if (!mergedCat.byMonth[m]) mergedCat.byMonth[m] = { count: 0, revenue: 0 };
              mergedCat.byMonth[m].count   += cat.byMonth[m].count;
              mergedCat.byMonth[m].revenue += cat.byMonth[m].revenue;
            });
            (cat.products || []).forEach(function(p) { mergedCat.products.push(p); });
          }
        } else {
          newCats.push(cat);
        }
      });
      d.categories = newCats;
      return d;
    }

      v2Val = (v2Val !== undefined) ? v2Val : null;

      if (targetView !== 'v2') {
        return v1Val !== null ? fmtN(v1Val) : dash();

      if (v1Val === v2Val) {
        return v2Val !== null ? fmtN(v2Val) : dash();

      var oldLine = '<span class="tgt-old">' + (v1Val !== null ? fmtN(v1Val) : '—') + '</span><span class="tgt-arrow">→</span>';

    function buildS5Chart() {
      if (!s5Data || !s5Data.dailyRefunds) return;
      var daily = s5Data.dailyRefunds;
      if (daily.length === 0) return;

      var firstDate = new Date(daily[0].date);
      var nowKST5 = new Date(); nowKST5.setHours(nowKST5.getHours() + 9);
      var todayS5Str = nowKST5.toISOString().substring(0, 10);
      var lastDate  = new Date(todayS5Str);
      var allDates  = [];
      var cur = new Date(firstDate);
      while (cur <= lastDate) {
        allDates.push(cur.toISOString().substring(0, 10));
        cur.setDate(cur.getDate() + 1);
      }
      var dataByDate = {};
      daily.forEach(function(d) { dataByDate[d.date] = d; });

      var labels = allDates.map(function(d) { return d.substring(5); });

      var datasets;
      var isStack = s5Filter === '전체';
      if (isStack) {
        datasets = S5_CATS.map(function(cat) {
          return {
            label: S5_LABELS[cat],
            data: allDates.map(function(d) {
              var entry = dataByDate[d];
              return (entry && entry.byCat && entry.byCat[cat]) || 0;
            }),
            backgroundColor: S5_COLORS[cat],
            borderRadius: 2, borderSkipped: false,
          };
        });
      } else {
        datasets = [{
          label: S5_LABELS[s5Filter] || s5Filter,
          data: allDates.map(function(d) {
            var entry = dataByDate[d];
            return (entry && entry.byCat && entry.byCat[s5Filter]) || 0;
          }),
          backgroundColor: S5_COLORS[s5Filter] || '#3D7FFF',
          borderRadius: 3, borderSkipped: false,
        }];
      }

      var gridColor = 'rgba(255,255,255,0.04)';
      var tickColor = '#3A4F6A';
      var mono      = "'JetBrains Mono', monospace";

      var todayLinePluginS5 = {
        id: 'todayLineS5',
        afterDraw: function(chart) {
          var idx = allDates.indexOf(todayS5Str);
          if (idx < 0) return;
          var xScale = chart.scales.x;
          var yScale = chart.scales.y;
          var ctx2   = chart.ctx;
          var x = xScale.getPixelForValue(idx);
          ctx2.save();
          ctx2.strokeStyle = 'rgba(255,90,80,0.65)';
          ctx2.setLineDash([4, 4]);
          ctx2.lineWidth = 1;
          ctx2.beginPath();
          ctx2.moveTo(x, yScale.top);
          ctx2.lineTo(x, yScale.bottom);
          ctx2.stroke();
          ctx2.setLineDash([]);
          ctx2.restore();
        }
      };

      if (s5Chart) s5Chart.destroy();
      var canvas = document.getElementById('s5-chart');
      s5Chart = new Chart(canvas, {
        type: 'bar',
        data: { labels: labels, datasets: datasets },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: isStack, labels: { color: '#8AAAC8', font: { size: 11, family: mono } } },
            tooltip: { mode: 'index', intersect: false },
          },
          scales: {
            x: {
              stacked: isStack,
              grid: { color: gridColor },
              ticks: { color: tickColor, font: { size: 10, family: mono }, maxRotation: 0 },
            },
            y: {
              stacked: isStack,
              grid: { color: gridColor },
              ticks: {
                color: tickColor, font: { size: 10, family: mono },
                stepSize: 1, precision: 0,
              },
              beginAtZero: true,
            },
          },
        },
        plugins: [todayLinePluginS5],
      });
    }

    function getWeekStart(dateStr) {
      var d    = new Date(dateStr + 'T00:00:00Z');
      var day  = d.getUTCDay(); // 0=일, 1=월
      var diff = day === 0 ? -6 : 1 - day;
      return new Date(d.getTime() + diff * 86400000).toISOString().substring(0, 10);
    }

    function weekStartToLabel(ws) {
      var mon = new Date(ws + 'T00:00:00Z');
      var sun = new Date(mon.getTime() + 6 * 86400000);
      return (mon.getUTCMonth()+1) + '/' + mon.getUTCDate()
           + '~' + (sun.getUTCMonth()+1) + '/' + sun.getUTCDate();
    }

    function buildWeeklyFromDaily(data) {
      var dailyStats = data.dailyStats || [];
      var catList    = data.categories || [];
      var weekData   = {};

      dailyStats.forEach(function(day) {
        var ws = getWeekStart(day.date);
        if (!weekData[ws]) weekData[ws] = {};
        Object.keys(day.byCategory || {}).forEach(function(catName) {
          var dc = day.byCategory[catName];
          if (!weekData[ws][catName]) weekData[ws][catName] = { count: 0, revenue: 0, products: {} };
          var wc = weekData[ws][catName];
          wc.count   += dc.count   || 0;
          wc.revenue += dc.revenue || 0;
          Object.keys(dc.products || {}).forEach(function(prodName) {
            var dp = dc.products[prodName];
            if (!wc.products[prodName]) wc.products[prodName] = { count: 0, revenue: 0 };
            wc.products[prodName].count   += dp.count   || 0;
            wc.products[prodName].revenue += dp.revenue || 0;
          });
        });
      });

      var weeks = Object.keys(weekData).sort();

      var categories = catList.map(function(cat) {
        var byWeek = {};
        var totalCount = 0, totalRevenue = 0;
        weeks.forEach(function(ws) {
          var wc = weekData[ws] && weekData[ws][cat.category];
          byWeek[ws] = wc ? { count: wc.count, revenue: wc.revenue } : { count: 0, revenue: 0 };
          totalCount   += byWeek[ws].count;
          totalRevenue += byWeek[ws].revenue;
        });
        var products = (cat.products || []).map(function(prod) {
          var pByWeek = {};
          var pCount = 0, pRevenue = 0;
          weeks.forEach(function(ws) {
            var wc = weekData[ws] && weekData[ws][cat.category];
            var pp = wc && wc.products[prod.name];
            pByWeek[ws] = pp ? { count: pp.count, revenue: pp.revenue } : { count: 0, revenue: 0 };
            pCount   += pByWeek[ws].count;
            pRevenue += pByWeek[ws].revenue;
          });
          return { name: prod.name, total: { count: pCount, revenue: pRevenue }, byMonth: pByWeek };
        });
        return {
          category: cat.category,
          total:    { count: totalCount, revenue: totalRevenue },
          byMonth:  byWeek,
          products: products,
        };
      });

      return { months: weeks, categories: categories };
    }

    function renderSection6(d, labelFn) {

        return;

      var months     = d.months     || [];
      var categories = d.categories || [];
      if (months.length === 0) {
        wrap.innerHTML = '<div class="state" style="min-height:60px">월별 데이터가 없습니다.</div>';
        return;
      }
      var totalCols  = 1 + 2 + months.length * 2;

      function vatMinus(rev) { return Math.round(rev / 1.1); }
      function monthLabel(m) { return labelFn ? labelFn(m) : (parseInt(m.split('-')[1], 10) + '월'); }

      function cellPair(count, revenue) {
        if (count === 0) {
          return '<td class="n dim">' + dash() + '</td>'
            + '<td class="n dim" style="border-right:1px solid var(--border)">' + dash() + '</td>';
        }
        return '<td class="n">' + count.toLocaleString('ko-KR') + '</td>'
          + '<td class="n" style="border-right:1px solid var(--border)">' + fmtN(vatMinus(revenue)) + '</td>';
      }

      // thead (2행)
      var thead = '<thead><tr>'
        + '<th class="col-name" rowspan="2">판매상품</th>'
        + '<th colspan="2" class="s6-group-th">합계</th>';
      months.forEach(function(m) {
        thead += '<th colspan="2" class="s6-group-th">' + monthLabel(m) + '</th>';
      });
      thead += '</tr><tr>'
        + '<th>건수</th><th style="border-right:1px solid var(--border)">금액 (VAT-)</th>';
      months.forEach(function() {
        thead += '<th>건수</th><th style="border-right:1px solid var(--border)">금액 (VAT-)</th>';
      });
      thead += '</tr></thead>';

      // Total 집계
      var totalCount = 0, totalRevenue = 0;
      var totalByMonth = {};
      months.forEach(function(m) { totalByMonth[m] = { count: 0, revenue: 0 }; });
      categories.forEach(function(cat) {
        totalCount   += cat.total.count;
        totalRevenue += cat.total.revenue;
        months.forEach(function(m) {
          var bm = (cat.byMonth && cat.byMonth[m]) || { count: 0, revenue: 0 };
          totalByMonth[m].count   += bm.count;
          totalByMonth[m].revenue += bm.revenue;
        });
      });

      // tbody
      var tbody = '<tbody>';

      // Total 행
      tbody += '<tr class="totals-row">'
        + '<td><span class="totals-label">Total</span></td>'
        + cellPair(totalCount, totalRevenue);
      months.forEach(function(m) {
        var bm = totalByMonth[m];
        tbody += cellPair(bm.count, bm.revenue);
      });
      tbody += '</tr>';

      var GROUP_HEADERS_S6 = {
        'Package - 런포트 패키지':     'RP',
        'Package - 버핏그라운드 패키지': 'BG',
        'Package - 팀버핏 패키지':     'TB',
        'Contents - 사우나only':       '기타',
        'Contents - 체험/일일권':      '체험',
      };

      categories.forEach(function(cat, catIdx) {
        var band         = BAND_MAP[cat.category] || '';
        var parts        = cat.category.split(' - ');
        var prefix       = parts[0];
        var subName      = parts.slice(1).join(' - ');
        var isGita       = cat.category === 'option';
        var isPTMergedS6 = cat.category === PT_MERGED;
        var displayPrefix  = isGita ? '기타' : isPTMergedS6 ? 'Contents' : prefix;
        var displaySubName = isGita ? '옵션상품' : subName;

        if (GROUP_HEADERS_S6[cat.category]) {
          tbody += '<tr class="group-header-row">'
            + '<td colspan="' + totalCols + '"><span class="group-label">'
            + GROUP_HEADERS_S6[cat.category]
            + '</span></td></tr>';
        }

        var catId = 's6-cat-' + catIdx;
        tbody += '<tr class="cat-row ' + band + '" data-cat-id="' + catId + '">'
          + '<td class="col-name"><span class="cat-name">'
          + '<span class="toggle-icon">▶</span>'
          + '<span class="cat-text">'
          + '<span class="cat-prefix">' + displayPrefix + '</span>'
          + displaySubName
          + '</span></span></td>';

        var isPendingS6 = PENDING_CATEGORIES.has(cat.category);
        if (isPendingS6) {
          var pendingTd = '<td class="n"><span class="pending-cell">(미집계중)</span></td>'
            + '<td class="n" style="border-right:1px solid var(--border)"><span class="pending-cell">(미집계중)</span></td>';
          tbody += pendingTd;
          months.forEach(function() { tbody += pendingTd; });
        } else {
          tbody += cellPair(cat.total.count, cat.total.revenue);
          months.forEach(function(m) {
            var bm = (cat.byMonth && cat.byMonth[m]) || { count: 0, revenue: 0 };
            tbody += cellPair(bm.count, bm.revenue);
          });
        }
        tbody += '</tr>';

        if (cat.products && cat.products.length > 0) {
          cat.products.forEach(function(prod, pi) {
            var isLast = pi === cat.products.length - 1;
            tbody += '<tr class="prod-row ' + (prod.total.count === 0 ? 'zero ' : '') + band + (isLast ? ' last-in-group' : '') + '" data-cat-parent="' + catId + '" style="display:none">'
              + '<td class="col-name"><span class="prod-name">└ ' + prod.name + '</span></td>';
            tbody += cellPair(prod.total.count, prod.total.revenue);
            months.forEach(function(m) {
              var bm = (prod.byMonth && prod.byMonth[m]) || { count: 0, revenue: 0 };
              tbody += cellPair(bm.count, bm.revenue);
            });
            tbody += '</tr>';
          });
        }
      });

      tbody += '</tbody>';

      document.getElementById('s6-table-wrap').innerHTML =
        '<table>' + thead + tbody + '</table>';
    }

    function load() {
      fetch(SCRIPT_URL + '?mode=monthly')
        .then(function(res) { return res.json(); })
        .then(function(d) {
          lastMonthlyData = mergePTMonthly(d);
          renderSection6(lastMonthlyData);
        })
        .catch(function() {});

      fetch(SCRIPT_URL + '?mode=sauna_cross')
        .then(function(res) { return res.json(); })
        .then(function(d) { if (!d.error) renderS4(d); })
        .catch(function() {});

      fetch(SCRIPT_URL + '?mode=refund')
        .then(function(res) { return res.json(); })
        .then(function(d) { renderS5(d); })
        .catch(function() {});

      fetch(SCRIPT_URL)
        .then(function(res) { return res.json(); })
        .then(function(data) {
          try {
            if (data.error) {
              document.getElementById('table-wrap').innerHTML =
                '<div class="state">⚠️ &nbsp;' + data.error + '</div>';
              return;
            }
            render(data);
          } catch(e) {
            document.getElementById('table-wrap').innerHTML =
              '<div class="state">⚠️ &nbsp;파싱 오류: ' + e.message + '</div>';
          }
        })
        .catch(function(err) {
          document.getElementById('table-wrap').innerHTML =
            '<div class="state">⚠️ &nbsp;로드 실패: ' + (err.message || err) + '</div>';
        });
    }

    (function cycle() {
      load();
      setTimeout(cycle, REFRESH_MS);
    })();

    // 섹션4 체험/일일권 차트 드래그/스와이프
    (function() {
      var c = document.getElementById('trial-chart');
      var w = document.getElementById('trial-chart-wrap');

      var tStartX = 0, tScrollLeft = 0;
      c.addEventListener('touchstart', function(e) {
        tStartX     = e.touches[0].clientX;
        tScrollLeft = w.scrollLeft;
      }, { passive: true });
      c.addEventListener('touchmove', function(e) {
        e.preventDefault();
        w.scrollLeft = tScrollLeft + (tStartX - e.touches[0].clientX);
      }, { passive: false });

      var mStartX = 0, mScrollLeft = 0, dragging = false;
      c.addEventListener('mousedown', function(e) {
        dragging = true; mStartX = e.clientX; mScrollLeft = w.scrollLeft;
        c.style.cursor = 'grabbing';
        if (trialChart) { trialChart.options.plugins.tooltip.enabled = false; trialChart.update('none'); }
        e.preventDefault();
      });
      document.addEventListener('mousemove', function(e) {
        if (!dragging) return;
        w.scrollLeft = mScrollLeft - (e.clientX - mStartX);
      });
      document.addEventListener('mouseup', function() {
        if (!dragging) return;
        dragging = false; c.style.cursor = 'grab';
        if (trialChart) { trialChart.options.plugins.tooltip.enabled = true; trialChart.update('none'); }
      });
    })();

    // 섹션2 차트 캔버스 스와이프/드래그 — Chart.js touch-action:none 우회
    (function() {
      var c = document.getElementById('trend-chart');
      var w = document.getElementById('s2-chart-wrap');

      // 터치 (모바일 스와이프)
      var tStartX = 0, tScrollLeft = 0;
      c.addEventListener('touchstart', function(e) {
        tStartX     = e.touches[0].clientX;
        tScrollLeft = w.scrollLeft;
      }, { passive: true });
      c.addEventListener('touchmove', function(e) {
        e.preventDefault();
        w.scrollLeft = tScrollLeft + (tStartX - e.touches[0].clientX);
      }, { passive: false });

      // 마우스 드래그 (데스크탑)
      var mStartX = 0, mScrollLeft = 0, dragging = false;
      c.addEventListener('mousedown', function(e) {
        dragging = true; mStartX = e.clientX; mScrollLeft = w.scrollLeft;
        c.style.cursor = 'grabbing';
        if (trendChart) { trendChart.options.plugins.tooltip.enabled = false; trendChart.update('none'); }
        e.preventDefault();
      });
      document.addEventListener('mousemove', function(e) {
        if (!dragging) return;
        w.scrollLeft = mScrollLeft - (e.clientX - mStartX);
      });
      document.addEventListener('mouseup', function() {
        if (!dragging) return;
        dragging = false; c.style.cursor = 'grab';
        if (trendChart) { trendChart.options.plugins.tooltip.enabled = true; trendChart.update('none'); }
      });
    })();
  </script>
</body>
</html>
